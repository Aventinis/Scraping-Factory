    <!-- Issue #136: shown only when this ApiConfig was sourced from an
         embedded <script> tag instead of a live network request — clarifies
         why the URL segments below describe a plain page load, not an API
         call. -->
    <p id="api-config-embedded-json-note" class="preview-summary hidden"></p>

    <!-- Nested JSON tree editor (Issue #54) — subsumes the old flat field
         list entirely (Phase A5): a single top-level match renders as a
         one-node-deep tree, visually almost identical to the old list but
         wrapped in the same tree-editor chrome every deeper level reuses. -->
    <div class="row-label" data-i18n="common.fields"></div>
    <ul id="api-tree-root" class="api-tree"></ul>
    <div class="actions">
      <button id="btn-api-tree-add-root" class="btn-secondary btn-tiny" type="button" data-i18n="apiTree.addRootGroupBtn"></button>
    </div>
    <!-- Results of an "add root group"/"add sub-field" search started from
         this screen (see btn-api-tree-add-root and the tree's own per-row
         add buttons) — same markup/behavior as the primary search's
         api-candidates-panel on screen-idle, see renderApiCandidates. -->
    <div id="api-tree-search-panel" class="api-candidates-panel hidden">
      <p id="api-tree-search-target" class="api-candidates-target"></p>
      <ul id="api-tree-search-list" class="api-candidates-list"></ul>
    </div>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.urlPathLabel"></div>
    <ul id="api-config-segments" class="api-config-parts"></ul>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.urlQueryLabel"></div>
    <ul id="api-config-query-params" class="api-config-parts"></ul>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.valueSourcesLabel"></div>
    <div id="api-config-parameters"></div>

    <!-- Request-body tree (Issue #55, Phase B4) — only shown for a POST
         candidate whose captured request body could be turned into a draft
         (see loadInitialBodyTreeForCandidate); hidden entirely for a GET
         config or an unparsable/bodyless POST. -->
    <div id="api-config-body-section" class="hidden">
      <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.bodyLabel"></div>
      <ul id="body-tree-root" class="body-tree"></ul>
    </div>

    <!-- Token/auth bootstrap (Issue #220): one extra request the generated
         script sends at the start of every run to fetch a fresh token,
         rendered by api-bootstrap-ui.js's renderApiBootstrapSection. -->
    <div id="api-bootstrap-section" class="api-bootstrap-section">
      <label class="output-settings-toggle" style="margin-top: 10px;">
        <input type="checkbox" id="toggle-api-bootstrap" />
        <span data-i18n="apiBootstrap.toggleLabel"></span>
      </label>
      <p class="browser-actions-hint" data-i18n="apiBootstrap.hint"></p>
      <div id="api-bootstrap-config" class="api-bootstrap-config hidden"></div>
    </div>

    <!-- Cursor/token-based pagination (Issue #224): follow a "next page"
         cursor the API returns in its own response, rendered by
         api-cursor-pagination-ui.js's renderApiCursorPaginationSection.
         Hidden for an embedded-JSON source (a page load has no cursor). -->
    <div id="api-cursor-section" class="api-cursor-section">
      <label class="output-settings-toggle" style="margin-top: 10px;">
        <input type="checkbox" id="toggle-api-cursor" />
        <span data-i18n="apiCursor.toggleLabel"></span>
      </label>
      <p class="browser-actions-hint" data-i18n="apiCursor.hint"></p>
      <div id="api-cursor-config" class="api-cursor-config hidden"></div>
    </div>

    <!-- Link-header pagination (Issue #321): follow the rel="next" URL the
         API names in its `Link` response header, rendered by
         api-link-pagination-ui.js's renderApiLinkPaginationSection. Hidden
         for an embedded-JSON source; exclusive with the cursor section. -->
    <div id="api-link-section" class="api-link-section">
      <label class="output-settings-toggle" style="margin-top: 10px;">
        <input type="checkbox" id="toggle-api-link" />
        <span data-i18n="apiLink.toggleLabel"></span>
      </label>
      <p class="browser-actions-hint" data-i18n="apiLink.hint"></p>
      <p id="api-link-detected-hint" class="browser-actions-hint hidden" data-i18n="apiLink.detectedHint"></p>
      <p id="api-link-post-hint" class="browser-actions-hint hidden" data-i18n="apiLink.needsGet"></p>
      <div id="api-link-config" class="api-cursor-config hidden">
        <div class="row-label" data-i18n="apiLink.maxPagesLabel"></div>
        <input type="number" min="1" step="1" id="input-api-link-max-pages" value="50" />
        <p class="browser-actions-hint" data-i18n="apiLink.firstPageHint"></p>
      </div>
    </div>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.headersLabel"></div>
    <p class="env-var-note" data-help-anchor><span data-i18n="envVar.whatLabel"></span><span class="help-host" data-help="help.envVar.what"></span></p>
    <ul id="api-config-headers" class="api-config-headers"></ul>

    <div class="actions" style="margin-top: 12px;">
      <button id="btn-api-config-cancel" class="btn-secondary" type="button" data-i18n="common.cancel"></button>
      <button id="btn-api-config-confirm" class="btn-primary" type="button" disabled data-i18n="common.apply"></button>
    </div>
