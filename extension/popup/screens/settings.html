<div class="url-row">
  <div class="row-label" data-i18n="settings.title"></div>
  <button id="btn-close-settings" class="btn-secondary btn-tiny" type="button" data-i18n="common.back"></button>
</div>

<!-- Cross-session preferences — moved here from the per-scrape Settings
     section (Issue-driven follow-up): these are personal preferences about
     how every future scrape should behave, not properties of the scrape
     currently being configured, so they persist via chrome.storage.local
     (shared/global-settings.js) instead of the per-scrape _state. -->
<div id="settings-preferences-section">
  <p class="row-label" data-i18n="settings.preferencesTitle"></p>
  <div class="output-settings-row">
    <label for="select-output-format" data-i18n="settings.outputFormatLabel"></label>
    <select id="select-output-format">
      <option value="default" data-i18n="settings.outputFormatDefault"></option>
      <option value="json" data-i18n="settings.outputFormatJson"></option>
      <option value="sqlite" data-i18n="settings.outputFormatSqlite"></option>
      <option value="xlsx" data-i18n="settings.outputFormatXlsx"></option>
    </select>
  </div>
  <p class="preview-summary" data-i18n="settings.outputFormatHint"></p>
  <label class="output-settings-toggle">
    <input type="checkbox" id="toggle-include-data-preview" />
    <span data-i18n="idle.dataPreviewToggle"></span>
  </label>
  <label class="output-settings-toggle">
    <input type="checkbox" id="toggle-include-output-file" />
    <span data-i18n="idle.outputFileToggle"></span>
  </label>
  <label class="output-settings-toggle">
    <input type="checkbox" id="toggle-external-config" />
    <span data-i18n="idle.externalConfigToggle"></span>
  </label>
  <p class="preview-summary" data-i18n="idle.externalConfigHint"></p>
  <!-- Issue #292: skip the companion's trial run — the script is returned
       right away, without having been run against the live page. -->
  <label class="output-settings-toggle">
    <input type="checkbox" id="toggle-skip-verification" />
    <span data-i18n="settings.skipVerificationToggle"></span>
  </label>
  <p class="preview-summary" data-i18n="settings.skipVerificationHint"></p>

  <!-- Default script name — pre-fills the per-scrape "Skriptname" input
       whenever a new site is detected (checkCompanion/the stale-URL
       correction), still editable per-scrape afterward. -->
  <p class="row-label" data-i18n="settings.scriptNameModeLabel"></p>
  <div class="mode-toggle" id="script-name-mode-toggle">
    <div class="mode-toggle-thumb"></div>
    <button id="btn-script-name-mode-fixed" class="mode-btn" type="button" data-i18n="settings.scriptNameModeFixed"></button>
    <button id="btn-script-name-mode-hostname" class="mode-btn" type="button" data-i18n="settings.scriptNameModeHostname"></button>
  </div>
  <div id="script-name-fixed-row" class="output-settings-row">
    <label for="input-script-name-fixed" data-i18n="settings.scriptNameFixedLabel"></label>
    <input type="text" id="input-script-name-fixed" data-i18n-placeholder="idle.scriptFilenamePlaceholder" autocomplete="off" />
  </div>
  <p class="preview-summary" data-i18n="settings.scriptNameHostnameHint" id="script-name-hostname-hint"></p>
</div>

<!-- Issue #352: self-service account on a companion that requires login —
     sign in / register / sign out / change password (account-ui.js). The
     token the companion hands out is stored as the access key below. -->
<div id="settings-account-section" class="hidden">
  <p class="row-label" data-i18n="settings.account.title"></p>
  <div id="account-signed-out">
    <div class="output-settings-row">
      <label for="input-account-name" data-i18n="settings.account.nameLabel"></label>
      <input type="text" id="input-account-name" autocomplete="username" />
    </div>
    <div class="output-settings-row">
      <label for="input-account-password" data-i18n="settings.account.passwordLabel"></label>
      <input type="password" id="input-account-password" autocomplete="current-password" />
    </div>
    <div class="output-settings-row hidden" id="account-repeat-row">
      <label for="input-account-password-repeat" data-i18n="settings.account.repeatLabel"></label>
      <input type="password" id="input-account-password-repeat" autocomplete="new-password" />
    </div>
    <!-- Issue #353: only when the companion collects email addresses and registration is open. -->
    <div class="output-settings-row hidden" id="account-email-row">
      <label for="input-account-email" id="label-account-email"></label>
      <input type="email" id="input-account-email" autocomplete="email" />
    </div>
    <div class="output-settings-row">
      <button id="btn-account-login" class="btn-secondary btn-tiny" type="button" data-i18n="settings.account.login"></button>
      <button id="btn-account-register" class="btn-secondary btn-tiny hidden" type="button" data-i18n="settings.account.register"></button>
      <button id="btn-account-forgot" class="btn-secondary btn-tiny hidden" type="button" data-i18n="settings.account.forgot"></button>
    </div>
    <p id="account-no-registration" class="preview-summary hidden" data-i18n="settings.account.noRegistration"></p>
    <!-- Issue #353: reset a forgotten password with a code mailed to the verified address. -->
    <div id="account-forgot-panel" class="hidden">
      <p class="preview-summary" data-i18n="settings.account.forgotHint"></p>
      <div class="output-settings-row">
        <label for="input-account-forgot-account" data-i18n="settings.account.forgotAccountLabel"></label>
        <input type="text" id="input-account-forgot-account" autocomplete="username" />
      </div>
      <div class="output-settings-row">
        <button id="btn-account-forgot-send" class="btn-secondary btn-tiny" type="button" data-i18n="settings.account.forgotSend"></button>
      </div>
      <div class="output-settings-row">
        <label for="input-account-reset-code" data-i18n="settings.account.codeLabel"></label>
        <input type="text" id="input-account-reset-code" inputmode="numeric" autocomplete="one-time-code" />
      </div>
      <div class="output-settings-row">
        <label for="input-account-reset-password" data-i18n="settings.account.newPasswordLabel"></label>
        <input type="password" id="input-account-reset-password" autocomplete="new-password" />
      </div>
      <div class="output-settings-row">
        <button id="btn-account-reset-confirm" class="btn-secondary btn-tiny" type="button" data-i18n="settings.account.resetConfirm"></button>
      </div>
    </div>
  </div>
  <div id="account-signed-in" class="hidden">
    <p id="account-signed-in-as" class="preview-summary"></p>
    <!-- Issue #353: the account's email address, its verification and changing it. -->
    <div id="account-email-section" class="hidden">
      <p id="account-email-state" class="preview-summary"></p>
      <div id="account-verify-row" class="hidden">
        <div class="output-settings-row">
          <label for="input-account-verify-code" data-i18n="settings.account.codeLabel"></label>
          <input type="text" id="input-account-verify-code" inputmode="numeric" autocomplete="one-time-code" />
        </div>
        <div class="output-settings-row">
          <button id="btn-account-verify" class="btn-secondary btn-tiny" type="button" data-i18n="settings.account.verify"></button>
          <button id="btn-account-resend" class="btn-secondary btn-tiny" type="button" data-i18n="settings.account.resend"></button>
        </div>
      </div>
      <div class="output-settings-row">
        <label for="input-account-new-email" data-i18n="settings.account.newEmailLabel"></label>
        <input type="email" id="input-account-new-email" autocomplete="email" />
      </div>
      <div class="output-settings-row">
        <label for="input-account-email-password" data-i18n="settings.account.passwordLabel"></label>
        <input type="password" id="input-account-email-password" autocomplete="current-password" />
      </div>
      <div class="output-settings-row">
        <button id="btn-account-set-email" class="btn-secondary btn-tiny" type="button" data-i18n="settings.account.setEmail"></button>
      </div>
    </div>
    <div class="output-settings-row">
      <button id="btn-account-logout" class="btn-secondary btn-tiny" type="button" data-i18n="settings.account.logout"></button>
      <button id="btn-account-logout-all" class="btn-secondary btn-tiny" type="button" data-i18n="settings.account.logoutAll"></button>
    </div>
    <div class="output-settings-row">
      <label for="input-account-current-password" data-i18n="settings.account.currentPasswordLabel"></label>
      <input type="password" id="input-account-current-password" autocomplete="current-password" />
    </div>
    <div class="output-settings-row">
      <label for="input-account-new-password" data-i18n="settings.account.newPasswordLabel"></label>
      <input type="password" id="input-account-new-password" autocomplete="new-password" />
    </div>
    <div class="output-settings-row">
      <button id="btn-account-change-password" class="btn-secondary btn-tiny" type="button" data-i18n="settings.account.changePassword"></button>
    </div>
  </div>
  <p id="account-status" class="preview-summary hidden"></p>
  <p class="preview-summary" data-i18n="settings.account.hint"></p>
</div>

<!-- Issue #278: access key for a shared companion with per-user
     authentication — a device preference (chrome.storage.local via
     shared/companion-config.js), sent as a Bearer header with every request. -->
<div id="settings-access-key-section">
  <p class="row-label" data-i18n="settings.accessKeyTitle"></p>
  <div class="output-settings-row">
    <label for="input-access-key" data-i18n="settings.accessKeyLabel"></label>
    <input type="password" id="input-access-key" data-i18n-placeholder="settings.accessKeyPlaceholder" autocomplete="off" />
  </div>
  <div class="output-settings-row">
    <button id="btn-access-key-save" class="btn-secondary btn-tiny" type="button" data-i18n="settings.accessKeySave"></button>
    <button id="btn-access-key-clear" class="btn-secondary btn-tiny" type="button" data-i18n="settings.accessKeyClear"></button>
  </div>
  <p id="access-key-status" class="preview-summary hidden"></p>
  <p class="preview-summary" data-i18n="settings.accessKeyHint"></p>
</div>

<!-- Issue #352: development builds only — account-ui.js removes this whole
     section when the extension is a release build (shared/build-config.js),
     so an ordinary user's extension cannot switch any of it on. -->
<div id="settings-developer-section">
  <p class="row-label" data-i18n="settings.developer.title"></p>
  <label class="output-settings-toggle">
    <input type="checkbox" id="toggle-dev-insecure-http" />
    <span data-i18n="settings.developer.insecureHttp"></span>
  </label>
  <div class="output-settings-row">
    <button id="btn-dev-open-companion" class="btn-secondary btn-tiny" type="button" data-i18n="settings.developer.openCompanion"></button>
  </div>
  <p class="preview-summary" data-i18n="settings.developer.hint"></p>
</div>

<!-- Output Blueprint management — moved here from modal-manage-blueprints
     (the per-scrape mapping *picker* stays in the idle screen's own
     Settings section; only create/edit/delete moves, since a blueprint is
     reusable across any site, not scoped to the scrape currently being
     configured). -->
<div id="settings-blueprints-section">
  <p class="row-label" data-i18n="modals.manageBlueprints.title"></p>
  <div id="manage-blueprints-list"></div>
  <p id="manage-blueprints-empty" class="preview-summary hidden" data-i18n="modals.manageBlueprints.empty"></p>
  <div class="actions">
    <button type="button" id="btn-blueprint-new" class="btn-secondary btn-tiny" data-i18n="modals.manageBlueprints.newBtn"></button>
  </div>
</div>

<!-- Issue #279: reusable transform-chain presets — built-ins (read-only)
     plus the user's own, saved from any field's transform editor via "Save
     as preset"; renamed/deleted here. Rendered by transform-presets-ui.js. -->
<div id="settings-transform-presets-section">
  <p class="row-label" data-i18n="transformPresets.settingsTitle"></p>
  <p class="preview-summary" data-i18n="transformPresets.settingsHint"></p>
  <div id="transform-presets-list"></div>
  <p id="transform-presets-unavailable" class="preview-summary hidden" data-i18n="transformPresets.unavailableHint"></p>
</div>

<!-- Cross-site saved configurations/outputs — the per-site "Saved
     configurations" panel on the idle screen (scoped to the currently open
     tab's hostname, with its own "Laden" action) is unaffected; this is a
     seitenübergreifende (cross-site) view for browsing/deleting anything
     saved for any site, with no "Laden" — loading only makes sense in the
     context of that site's own currently-open tab. -->
<div id="settings-all-configs-section">
  <p class="row-label" data-i18n="settings.allConfigsTitle"></p>
  <div id="all-saved-configs-list"></div>
  <p id="all-saved-configs-empty" class="preview-summary hidden" data-i18n="settings.allConfigsEmpty"></p>
</div>
