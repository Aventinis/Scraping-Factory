      <!-- Issue #184: output-format/inspection toggles (Json output, Issue
           #86; trial-run data preview, Issue #122; proxy support, Issue
           #88) are comparatively infrequent settings, not part of the
           field/container/API configuration flow the user touches on every
           scraper build — grouped into their own collapsible section for
           the same reason Issue #183 grouped change-detection/hardening
           into "Monitoring" below, reusing the exact same chevron+.collapsed
           convention (Issue #139). Unlike Monitoring, there's no
           auto-expand-if-already-configured logic here
           (_state.settingsSectionOpen has no
           computeInitialMonitoringSectionOpen equivalent): Json output/data
           preview are non-persisted, per-generate opt-ins that are always
           off again on a fresh popup open, and while Proxy *is* persisted
           (real scrape-target configuration, like change detection), there's
           still no auto-expand override for it here the way Monitoring has
           for change detection/hardening — collapsed by default is still
           the starting state, a returning user with a proxy configured
           re-expands this section once themselves. -->
      <div id="settings-section">
        <div id="settings-section-toggle" class="monitoring-section-header" role="button" tabindex="0">
          <span class="monitoring-section-chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
          <span data-i18n="idle.settingsSectionToggle"></span>
        </div>
        <div id="settings-section-content" class="hidden">
          <label class="output-settings-toggle">
            <input type="checkbox" id="toggle-output-json" />
            <span data-i18n="idle.outputJsonToggle"></span>
          </label>
          <label class="output-settings-toggle">
            <input type="checkbox" id="toggle-include-data-preview" />
            <span data-i18n="idle.dataPreviewToggle"></span>
          </label>
          <!-- Issue #161: opt-in full trial-run output download — the
               complete, uncapped counterpart to the data preview above
               (independent of it; either/both/neither can be on). Lets a
               non-technical user get the actual scraped data directly from
               the popup without running the downloaded script themselves. -->
          <label class="output-settings-toggle">
            <input type="checkbox" id="toggle-include-output-file" />
            <span data-i18n="idle.outputFileToggle"></span>
          </label>
          <!-- Issue #88: opt-in proxy support — like the change-detection
               fields below, this is the *name* of an environment variable
               holding a comma-separated proxy URL list, never a literal
               proxy address (mirrors FillAction's own
               environmentVariableName input), read by the generated script
               at runtime via os.environ[...]. Moved into this section by
               the Issue #184 follow-up (previously sat directly in
               .output-settings, between this section and Monitoring). -->
          <label class="output-settings-toggle">
            <input type="checkbox" id="toggle-proxy" />
            <span data-i18n="idle.proxyToggle"></span>
          </label>
          <div id="proxy-config" class="hidden">
            <div class="output-settings-row">
              <label for="input-proxy-env-var" data-i18n="idle.proxyEnvVarLabel"></label>
              <input type="text" id="input-proxy-env-var" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
            </div>
            <p class="preview-summary" data-i18n="idle.proxyHint"></p>
          </div>
          <!-- Issue #178: opt-in external XML config file — a plain on/off
               switch, no sub-fields (which values end up editable depends
               entirely on the current mode/shape, not a user choice here).
               The file itself doesn't exist until the generated script's
               first real run, which self-creates it next to itself. -->
          <label class="output-settings-toggle">
            <input type="checkbox" id="toggle-external-config" />
            <span data-i18n="idle.externalConfigToggle"></span>
          </label>
          <p class="preview-summary" data-i18n="idle.externalConfigHint"></p>
          <!-- Issue #174: opt-in classic multi-page pagination — follows
               either a "next page" link (CSS selector, href resolved
               relative to the current page) or a {page}-templated URL,
               starting from each start URL as page 1, until a page yields
               nothing, the safety cap is reached, or (next-link kind) the
               selector stops matching. Hidden entirely for API mode (see
               render()'s own #pagination-toggle-row toggle), same reasoning
               as #additional-urls-row — API mode already has its own page-
               parameter mechanism via a Number RangeSource. -->
          <label class="output-settings-toggle" id="pagination-toggle-row">

                <input type="text" id="input-pagination-url-template" data-i18n-placeholder="idle.paginationUrlTemplatePlaceholder" autocomplete="off" />
              </div>
              <p class="preview-summary" data-i18n="idle.paginationUrlTemplateHint"></p>

            <div class="output-settings-row">
              <label for="input-pagination-max-pages" data-i18n="idle.paginationMaxPagesLabel"></label>
              <input type="number" id="input-pagination-max-pages" min="1" step="1" />
            </div>
          </div>
          <!-- Issue #191: opt-in output blueprint field mapping — only
               reachable for flat-shaped output (flat mode's own Fields, or
               API mode's flat ItemsPath/Fields shape), hidden entirely
               otherwise (see render()'s own #output-blueprint-toggle-row
               toggle), the same "ship the simpler shape first" reasoning
               #additional-urls-row/#pagination-toggle-row already establish
               for their own tree-mode exclusions. The blueprint list itself
               is unscoped (reusable across any site/configuration), fetched
               once on companion connect like the saved-configs list. -->
          <div class="output-settings-row" id="output-blueprint-toggle-row">
            <label for="select-output-blueprint" data-i18n="idle.outputBlueprintLabel"></label>
            <select id="select-output-blueprint">
              <option value="" data-i18n="idle.outputBlueprintNoneOption"></option>

            <button type="button" id="btn-manage-blueprints" class="btn-secondary btn-tiny" data-i18n="idle.manageBlueprintsBtn"></button>

            <p class="preview-summary" data-i18n="idle.outputBlueprintMappingHint"></p>
            <ul id="output-blueprint-mapping-list"></ul>

        </div>
      </div>
      <!-- Issue #183: change detection (#87) and script hardening (#129-
           #133) are grouped into one collapsible section — both are about
           monitoring a script over repeated, unattended runs (change
           detection notifies when the *data* changes between runs,
           hardening catches when the *scrape itself* silently breaks),
           unlike the rest of .output-settings, which is about the one-time
           act of generating the script. Collapsed by default; render()
           auto-expands it once, on the first render after a popup (re)open
           if either change detection or any hardening check is already
           configured (see _state.monitoringSectionOpen/
           computeInitialMonitoringSectionOpen in popup.js) — a returning
           user isn't forced to re-expand it just to see their own
           settings. Reuses the shared chevron+.collapsed convention
           (Issue #139) already used by the group/api/DOM tree views,
           rather than the "Show/Hide" button-text-swap pattern the API
           mode recorded-requests panel uses — a fixed section title that
           expands fits a "collapsible section" better than a panel whose
           own visibility is the primary thing being toggled. -->
      <div id="monitoring-section">
        <div id="monitoring-section-toggle" class="monitoring-section-header" role="button" tabindex="0">
          <span class="monitoring-section-chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
          <span data-i18n="idle.monitoringSectionToggle"></span>
        </div>
        <div id="monitoring-section-content" class="hidden">
          <!-- Issue #87: opt-in change detection + notification — every
               credential/target field below is the *name* of an
               environment variable, never a literal value (mirrors
               FillAction's own environmentVariableName input), read by the
               generated script at runtime via os.environ[...]. -->
          <label class="output-settings-toggle">
            <input type="checkbox" id="toggle-change-detection" />
            <span data-i18n="idle.changeDetectionToggle"></span>

          <div id="change-detection-config" class="hidden">
            <div class="mode-toggle" style="margin-bottom: 8px;">
              <div class="mode-toggle-thumb"></div>
              <button id="btn-notify-email" class="mode-btn active" type="button" data-i18n="idle.notifyEmail"></button>
              <button id="btn-notify-webhook" class="mode-btn" type="button" data-i18n="idle.notifyWebhook"></button>
            </div>
            <div id="notify-email-fields">
              <div class="output-settings-row">
                <label for="input-cd-smtp-host" data-i18n="idle.smtpHostEnvVarLabel"></label>
                <input type="text" id="input-cd-smtp-host" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
              </div>
              <div class="output-settings-row">
                <label for="input-cd-smtp-port" data-i18n="idle.smtpPortEnvVarLabel"></label>
                <input type="text" id="input-cd-smtp-port" data-i18n-placeholder="idle.envVarPlaceholderOptional" autocomplete="off" />

                <label for="input-cd-smtp-username" data-i18n="idle.smtpUsernameEnvVarLabel"></label>
                <input type="text" id="input-cd-smtp-username" data-i18n-placeholder="idle.envVarPlaceholderOptional" autocomplete="off" />
              </div>
              <div class="output-settings-row">
                <label for="input-cd-smtp-password" data-i18n="idle.smtpPasswordEnvVarLabel"></label>
                <input type="text" id="input-cd-smtp-password" data-i18n-placeholder="idle.envVarPlaceholderOptional" autocomplete="off" />
              </div>
              <div class="output-settings-row">
                <label for="input-cd-email-from" data-i18n="idle.notifyEmailFromEnvVarLabel"></label>
                <input type="text" id="input-cd-email-from" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
              </div>
              <div class="output-settings-row">
                <label for="input-cd-email-to" data-i18n="idle.notifyEmailToEnvVarLabel"></label>
                <input type="text" id="input-cd-email-to" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
              </div>
            </div>
            <div id="notify-webhook-fields" class="hidden">
              <div class="output-settings-row">
                <label for="input-cd-webhook-url" data-i18n="idle.webhookUrlEnvVarLabel"></label>
                <input type="text" id="input-cd-webhook-url" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
              </div>
            </div>
            <p class="preview-summary" data-i18n="idle.changeDetectionHint"></p>
          </div>
          <!-- Issue #129: opt-in script hardening — the generated script
               re-checks its own result after scraping (e.g. before a
               cron-scheduled re-run, weeks after generation) and either
               warns (script still exits 0) or fails the run (script exits
               a distinct non-zero code) per check, independently
               configurable. This is the first of five planned checks (see
               CLAUDE.md) — one row per check, built so each of the other
               four can add its own row below without restructuring
               #hardening-config. -->
          <div id="hardening-config">
            <label class="output-settings-toggle">
              <input type="checkbox" id="toggle-hardening-no-result" />
              <span data-i18n="idle.hardeningNoResultToggle"></span>
            </label>
            <div id="hardening-no-result-severity" class="mode-toggle hidden" style="margin: 6px 0 8px;">
              <div class="mode-toggle-thumb"></div>
              <button id="btn-hardening-no-result-warning" class="mode-btn active" type="button" data-i18n="idle.hardeningSeverityWarning" data-i18n-title="idle.hardeningSeverityWarningTitle"></button>

            </div>
            <!-- Issue #130: per-field empty-value-rate check — catches a
                 field whose selector silently starts matching the wrong
                 thing (row/element count stays healthy, but the value is
                 always empty), which #129's own "no result" check above
                 can't detect at all. One row per monitored field, reusing
                 the exact field list already built in the current mode
                 (see collectFieldNames) instead of a free-text field name
                 input. Rows are entirely JS-rendered
                 (renderHardeningNullRateList) — this div is just the mount
                 point. -->
            <div class="output-settings-toggle" style="margin-top: 10px;">
              <span data-i18n="idle.hardeningNullRateSectionLabel"></span>
            </div>
            <div id="hardening-null-rate-list"></div>
            <button type="button" id="btn-add-null-rate-check" class="btn-secondary btn-tiny" data-i18n="idle.hardeningNullRateAddBtn"></button>
            <!-- Issue #131: baseline-drop check — catches a gradual volume
                 drop (e.g. a broken "load more"/pagination selector) that
                 neither #129's "no result" nor #130's per-field null-rate
                 would ever trip, by comparing this run's own result count
                 against the last run's (tracked by the generated script
                 itself in a small sidecar file next to its own output, not
                 sent to/known by the companion at all). Single toggle+
                 severity+percent row, same shape as the "no result" check
                 above (unlike #130's dynamic per-field list). -->
            <label class="output-settings-toggle" style="margin-top: 10px;">
              <input type="checkbox" id="toggle-hardening-baseline" />
              <span data-i18n="idle.hardeningBaselineToggle"></span>
            </label>
            <div id="hardening-baseline-config" class="hidden">
              <div id="hardening-baseline-severity" class="mode-toggle" style="margin: 6px 0 8px;">
                <div class="mode-toggle-thumb"></div>
                <button id="btn-hardening-baseline-warning" class="mode-btn active" type="button" data-i18n="idle.hardeningSeverityWarning" data-i18n-title="idle.hardeningSeverityWarningTitle"></button>
                <button id="btn-hardening-baseline-error" class="mode-btn" type="button" data-i18n="idle.hardeningSeverityError" data-i18n-title="idle.hardeningSeverityErrorTitle"></button>
              </div>
              <label class="browser-action-field-row">
                <span data-i18n="idle.hardeningBaselineThresholdLabel"></span>
                <input type="number" min="0" max="100" id="input-hardening-baseline-threshold" />%
              </label>
            </div>
            <!-- Issue #132: blocking-detection check — catches a site that
                 starts blocking the script (rate-limiting, IP ban, CAPTCHA
                 wall, redirect to a login page) while still responding
                 with a normal-looking HTTP 200, which none of the checks
                 above would necessarily catch. Same single toggle+severity
                 shape as baseline above, plus an optional min-body-length
                 number input and a one-phrase-per-line textarea (a
                 redirect to a different host is always checked, no input
                 needed for that signal). -->
            <label class="output-settings-toggle" style="margin-top: 10px;">
              <input type="checkbox" id="toggle-hardening-blocking" />
              <span data-i18n="idle.hardeningBlockingToggle"></span>
            </label>
            <div id="hardening-blocking-config" class="hidden">
              <div id="hardening-blocking-severity" class="mode-toggle" style="margin: 6px 0 8px;">
                <div class="mode-toggle-thumb"></div>
                <button id="btn-hardening-blocking-warning" class="mode-btn active" type="button" data-i18n="idle.hardeningSeverityWarning" data-i18n-title="idle.hardeningSeverityWarningTitle"></button>
                <button id="btn-hardening-blocking-error" class="mode-btn" type="button" data-i18n="idle.hardeningSeverityError" data-i18n-title="idle.hardeningSeverityErrorTitle"></button>
              </div>
              <label class="browser-action-field-row">
                <span data-i18n="idle.hardeningBlockingMinBodyLengthLabel"></span>
                <input type="number" min="1" id="input-hardening-blocking-min-body-length" data-i18n-placeholder="idle.hardeningBlockingMinBodyLengthPlaceholder" />
              </label>
              <div class="output-settings-row" style="align-items: flex-start; margin-top: 6px;">
                <label for="input-hardening-blocking-phrases" data-i18n="idle.hardeningBlockingPhrasesLabel"></label>
                <textarea id="input-hardening-blocking-phrases" rows="2" data-i18n-placeholder="idle.hardeningBlockingPhrasesPlaceholder"></textarea>
              </div>
            </div>
            <!-- Issue #133 (+ container-mode and, since #204, Api-mode-tree
                 follow-ups): required-fields check — a row (flat/Api-flat
                 mode) or repeating group instance (container mode/Api-tree
                 mode) missing a value for any of these fields is dropped
                 from the output entirely (rather than written with a blank
                 cell), e.g. for a NOT NULL database column. Supported for
                 every mode/shape now, so this section is never hidden.
                 Unlike the null-rate list above (each row its own draft
                 object), a required field is already a complete, chosen
                 name the moment it's in the list — picking a *new* one uses
                 one shared select/button pair instead of a per-row field
                 picker. -->
            <div id="hardening-required-fields-section">
              <label class="output-settings-toggle" style="margin-top: 10px;">
                <input type="checkbox" id="toggle-hardening-required-fields" />
                <span data-i18n="idle.hardeningRequiredFieldsToggle"></span>
              </label>
              <div id="hardening-required-fields-config" class="hidden">
                <div id="hardening-required-fields-severity" class="mode-toggle" style="margin: 6px 0 8px;">
                  <div class="mode-toggle-thumb"></div>
                  <button id="btn-hardening-required-fields-warning" class="mode-btn active" type="button" data-i18n="idle.hardeningSeverityWarning" data-i18n-title="idle.hardeningSeverityWarningTitle"></button>
                  <button id="btn-hardening-required-fields-error" class="mode-btn" type="button" data-i18n="idle.hardeningSeverityError" data-i18n-title="idle.hardeningSeverityErrorTitle"></button>
                </div>
                <div id="hardening-required-fields-list"></div>
                <div class="hardening-required-field-add-row">
                  <select id="select-hardening-required-field"></select>
                  <button type="button" id="btn-add-required-field" class="btn-secondary btn-tiny" data-i18n="idle.hardeningRequiredFieldsAddBtn"></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Filenames last: a final naming step right before Export/Generate,
           below every other output-settings toggle. -->
      <div class="output-settings-row">
        <label for="input-script-filename" data-i18n="idle.scriptFilenameLabel"></label>
        <input type="text" id="input-script-filename" data-i18n-placeholder="idle.scriptFilenamePlaceholder" autocomplete="off" />
        <span class="output-settings-ext">.py</span>
      </div>
      <!-- Issue #182: hidden for Blocks mode — there's no single output
           file to name, each block names its own (see #blocks-mode-section's
           own "Output file name" input for the block currently being
           edited). -->
      <div id="output-filename-row" class="output-settings-row">
        <label for="input-output-filename" data-i18n="idle.outputFilenameLabel"></label>
        <input type="text" id="input-output-filename" data-i18n-placeholder="idle.outputFilenamePlaceholder" autocomplete="off" />
        <span id="output-filename-ext" class="output-settings-ext">.csv</span>
      </div>
    </div>
    </div>

    <!-- Issue #141: local SQLite-backed configuration history — save the
         current Fields/Groups/Api config to the companion's local SQLite
         store and reload it later instead of rebuilding selectors from
         scratch every time the same site is scraped. Scoped to the current
         page's hostname (fetchSavedConfigs/SavedConfigStore.ListByUrl).
         "Laden" restores everything buildScrapingConfig captures except
         `url` itself, which always stays whatever the live browser tab
         shows (see config-import.js's applyConfigToState doc comment). -->
    <div id="saved-configs-section">
      <p class="preview-summary" data-i18n="idle.savedConfigsTitle"></p>
      <div id="saved-configs-list"></div>
      <p id="saved-configs-empty" class="preview-summary hidden" data-i18n="idle.savedConfigsEmpty"></p>
    </div>

    <div class="actions" style="margin-top: 10px;">
      <button id="btn-export-config" class="btn-secondary" disabled data-i18n="idle.exportConfigBtn" data-i18n-title="idle.exportConfigTitle"></button>
      <button id="btn-save-config" class="btn-secondary" disabled data-i18n="idle.saveConfigBtn" data-i18n-title="idle.saveConfigTitle"></button>
      <button id="btn-generate" class="btn-primary" disabled data-i18n="idle.generateBtn"></button>
    </div>
