<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Scraping Factory</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Language selector: rendered outside every .screen section so switching
       language is always possible, regardless of app state (checking,
       error, idle, …). See popup.js's applyStaticTranslations/setLanguage. -->
  <div id="lang-switcher">
    <!-- Theme toggle (Issue #140): cycles system -> light -> dark -> system
         on click (SFTheme.cycleTheme); the icon shown always reflects the
         *current* state, same as the language <select>'s own value does —
         see popup.js's renderThemeToggle. -->
    <button id="theme-toggle" type="button" data-i18n-title="theme.toggleTitle"></button>
    <select id="lang-select" aria-label="Language / Sprache / Idioma" title="Language / Sprache / Idioma">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
  </div>

  <!-- CHECKING_COMPANION -->
  <section id="screen-checking" class="screen">
    <div class="spinner"></div>
    <p data-i18n="checking.message"></p>
  </section>

  <!-- COMPANION_ERROR -->
  <section id="screen-error" class="screen hidden">
    <p class="error-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="12 3 22 20 2 20"></polygon>
        <line x1="12" y1="9" x2="12" y2="14"></line>
        <circle cx="12" cy="17.3" r="0.6" fill="currentColor" stroke="none"></circle>
      </svg>
    </p>
    <p data-i18n="error.title"></p>
    <p class="error-hint" data-i18n="error.hint"></p>
    <p id="error-current-url" class="error-current-url"></p>
    <div class="actions">
      <button id="btn-retry" class="btn-primary" data-i18n="common.retry"></button>
      <button id="btn-report-bug-error" class="btn-secondary" data-i18n="common.reportBug"></button>
    </div>
    <div class="companion-url-override">
      <label for="input-companion-url" data-i18n="error.customUrlLabel"></label>
      <input type="text" id="input-companion-url" data-i18n-placeholder="error.customUrlPlaceholder" autocomplete="off" />
      <div class="actions">
        <button id="btn-use-companion-url" class="btn-secondary" data-i18n="error.useCustomUrl"></button>
        <button id="btn-reset-companion-url" class="btn-secondary" data-i18n="error.resetCustomUrl"></button>
      </div>
    </div>
  </section>

  <!-- IDLE -->
  <section id="screen-idle" class="screen hidden">
    <div class="screen-idle-scroll">
    <div class="url-row">
      <div class="row-label" data-i18n="idle.urlLabel"></div>
      <div id="url-display" class="url-value"></div>
      <button id="btn-check-robots" class="btn-secondary btn-tiny" type="button" data-i18n="idle.robotsCheckBtn" data-i18n-title="idle.robotsCheckTitle"></button>
      <p id="robots-txt-result" class="robots-txt-result hidden"></p>
    </div>

    <!-- Issue #83: extra start URLs the same extraction config runs against,
         in addition to the page above — mode-independent like engine/browser-
         actions, but hidden for API mode (Api builds its own request URL and
         the companion rejects the combination). Placed right under the URL
         it complements, rather than down in output-settings. -->
    <div id="additional-urls-row" class="output-settings-row" style="align-items: flex-start; margin-bottom: 14px;">
      <label for="input-additional-urls" data-i18n="idle.additionalUrlsLabel"></label>
      <textarea id="input-additional-urls" rows="3" data-i18n-placeholder="idle.additionalUrlsPlaceholder"></textarea>
    </div>

    <div class="mode-toggle">
      <div class="mode-toggle-thumb"></div>
      <button id="btn-mode-flat" class="mode-btn active" type="button" data-i18n="idle.modeFlat"></button>
      <button id="btn-mode-container" class="mode-btn" type="button" data-i18n="idle.modeContainer"></button>
      <button id="btn-mode-api" class="mode-btn" type="button" data-i18n="idle.modeApi"></button>
    </div>

    <!-- Engine + browser actions (Issue #41/#42, Phase 5): applies across
         all three modes above, so it lives outside the mode-specific
         sections — same "global setting" treatment as output-settings
         below. Browser-actions run before extraction regardless of mode
         (see companion ScrapingPlanBuilder). -->
    <div class="engine-section">
      <div class="row-label" data-i18n="idle.engineLabel"></div>
      <div class="mode-toggle" style="margin-bottom: 8px;">
        <div class="mode-toggle-thumb"></div>
        <button id="btn-engine-static" class="mode-btn active" type="button" data-i18n="idle.engineStatic"></button>
        <button id="btn-engine-browser" class="mode-btn" type="button" data-i18n="idle.engineBrowser" data-i18n-title="idle.engineBrowserTitle"></button>
      </div>

      <div id="browser-actions-section" class="hidden">
        <div class="row-label" data-i18n="browserActions.title"></div>
        <p class="browser-actions-hint" data-i18n="browserActions.hint"></p>
        <div id="browser-actions-list"></div>
        <div class="actions">
          <button id="btn-add-action-wait" class="btn-secondary btn-tiny" type="button" data-i18n="browserActions.addWaitBtn"></button>
          <button id="btn-add-action-fill" class="btn-secondary btn-tiny" type="button" data-i18n="browserActions.addFillBtn"></button>
          <button id="btn-add-action-click" class="btn-secondary btn-tiny" type="button" data-i18n="browserActions.addClickBtn"></button>
          <button id="btn-add-action-scroll" class="btn-secondary btn-tiny" type="button" data-i18n="browserActions.addScrollBtn"></button>
        </div>

        <!-- Issue #175: opt-in persistent session/cookie handling —
             Browser-engine only (this whole section is already hidden for
             Static), placed here rather than in the general output-settings
             "Settings" section since it's specifically about reusing
             whatever session a login flow (the Fill/Click actions above)
             establishes, not an unrelated output/inspection format choice. -->
        <label class="output-settings-toggle" id="persistent-session-toggle-row">
          <input type="checkbox" id="toggle-persistent-session" />
          <span data-i18n="browserActions.persistentSessionToggle"></span>
        </label>
        <p class="preview-summary" data-i18n="browserActions.persistentSessionHint"></p>
      </div>
    </div>

    <div id="flat-mode-section">
      <div class="row-label" style="margin-bottom: 6px;" data-i18n="common.fields"></div>
      <div id="fields-list"></div>
      <div class="actions">
        <button id="btn-add-field" class="btn-secondary" data-i18n="idle.addFieldBtn"></button>
      </div>
    </div>

    <div id="container-mode-section" class="hidden">
      <div class="row-label" style="margin-bottom: 6px;" data-i18n="common.containers"></div>
      <ul id="group-tree-root" class="group-tree"></ul>
      <div class="actions">
        <button id="btn-add-root-container" class="btn-secondary" data-i18n="idle.addContainerBtn"></button>
      </div>
    </div>

    <!-- API-Mode (Issue #53, Phase 6): recording (Phase 3), candidate search
         (Phase 4) and the confirmed-ApiConfig summary (Phase 5) all live
         here now, gated behind the mode toggle above like flat/container. -->
    <div id="api-mode-section" class="hidden">
      <div class="actions">
        <button id="btn-api-capture" class="btn-toggle" type="button" data-i18n="idle.apiCaptureStartBtn" data-i18n-title="idle.apiCaptureTitle"></button>
      </div>
      <p id="api-capture-summary" class="preview-summary hidden"></p>

      <!-- Recorded-endpoints viewer: lets whoever wants the detail inspect
           the raw pool directly, independent of the click-based value
           search below. -->
      <div class="actions" style="margin-top: 6px;">
        <button id="btn-api-entries-toggle" class="btn-secondary btn-tiny" type="button" disabled data-i18n-title="idle.apiEntriesTitle"></button>
      </div>
      <div id="api-entries-panel" class="api-candidates-panel hidden">
        <ul id="api-entries-list" class="api-candidates-list"></ul>
      </div>

      <div class="actions" style="margin-top: 6px;">
        <button id="btn-api-search" class="btn-secondary" type="button" disabled data-i18n="idle.apiSearchBtn" data-i18n-title="idle.apiSearchTitle"></button>
      </div>

      <!-- Issue #136: an alternative to recording+search above, for sites
           that embed their complete data in the initial page HTML (no
           separate, capturable network request ever happens) — needs no
           recording toggle at all, so it's always available. Feeds the same
           #api-candidates-panel/-list below; the resulting candidate is
           dispatched by shape (candidate.scriptSelector) in popup.js. -->
      <div class="actions" style="margin-top: 6px;">
        <button id="btn-embedded-json-search" class="btn-secondary" type="button" data-i18n="idle.apiEmbeddedJsonSearchBtn" data-i18n-title="idle.apiEmbeddedJsonSearchTitle"></button>
      </div>
      <div id="api-candidates-panel" class="api-candidates-panel hidden">
        <p id="api-candidates-target" class="api-candidates-target"></p>
        <ul id="api-candidates-list" class="api-candidates-list"></ul>
      </div>

      <!-- Shown once "Übernehmen" was clicked on the API_CONFIG screen;
           "Verwerfen" just clears it so a bad config isn't stuck. -->
      <div id="api-config-panel" class="api-candidates-panel hidden">
        <p id="api-config-summary" class="api-candidates-target"></p>
        <div class="actions">
          <button id="btn-api-config-discard" class="btn-secondary btn-tiny" type="button" data-i18n="common.discard"></button>
        </div>
      </div>
    </div>

    <div class="output-settings">
      <!-- Vorschau highlights matched DOM elements — meaningless for
           API-Mode, which extracts from a JSON body instead, so it's hidden
           there. Deliberately kept above/outside the collapsible "Settings"
           section below (Issue #184 follow-up) rather than inside it like
           the other two toggles — it's a live, on-page action the user
           reaches for on every pick, not an infrequent format/inspection
           setting the way Json output/data-preview/proxy are. -->
      <div id="preview-section">
        <div class="actions" style="margin-top: 10px;">
          <button id="btn-preview" class="btn-toggle" disabled data-i18n="idle.previewShowBtn" data-i18n-title="idle.previewTitle"></button>
        </div>
        <p id="preview-summary" class="preview-summary hidden"></p>
      </div>

      <!-- Issue #184: output-format/inspection toggles (Json output, Issue
           #86; trial-run data preview, Issue #122; proxy support, Issue
           #88) are comparatively infrequent settings, not part of the
           field/container/API configuration flow the user touches on every
           scraper build — grouped into their own collapsible section for
           the same reason Issue #183 grouped change-detection/hardening
           into "Monitoring" below, reusing the exact same chevron+.collapsed
           convention (Issue #139). Unlike Monitoring, there's no
           auto-expand-if-already-configured logic here
           (_state.settingsSectionOpen has no
           computeInitialMonitoringSectionOpen equivalent): Json output/data
           preview are non-persisted, per-generate opt-ins that are always
           off again on a fresh popup open, and while Proxy *is* persisted
           (real scrape-target configuration, like change detection), there's
           still no auto-expand override for it here the way Monitoring has
           for change detection/hardening — collapsed by default is still
           the starting state, a returning user with a proxy configured
           re-expands this section once themselves. -->
      <div id="settings-section">
        <div id="settings-section-toggle" class="monitoring-section-header" role="button" tabindex="0">
          <span class="monitoring-section-chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
          <span data-i18n="idle.settingsSectionToggle"></span>
        </div>
        <div id="settings-section-content" class="hidden">
          <label class="output-settings-toggle">
            <input type="checkbox" id="toggle-output-json" />
            <span data-i18n="idle.outputJsonToggle"></span>
          </label>
          <label class="output-settings-toggle">
            <input type="checkbox" id="toggle-include-data-preview" />
            <span data-i18n="idle.dataPreviewToggle"></span>
          </label>
          <!-- Issue #161: opt-in full trial-run output download — the
               complete, uncapped counterpart to the data preview above
               (independent of it; either/both/neither can be on). Lets a
               non-technical user get the actual scraped data directly from
               the popup without running the downloaded script themselves. -->
          <label class="output-settings-toggle">
            <input type="checkbox" id="toggle-include-output-file" />
            <span data-i18n="idle.outputFileToggle"></span>
          </label>
          <!-- Issue #88: opt-in proxy support — like the change-detection
               fields below, this is the *name* of an environment variable
               holding a comma-separated proxy URL list, never a literal
               proxy address (mirrors FillAction's own
               environmentVariableName input), read by the generated script
               at runtime via os.environ[...]. Moved into this section by
               the Issue #184 follow-up (previously sat directly in
               .output-settings, between this section and Monitoring). -->
          <label class="output-settings-toggle">
            <input type="checkbox" id="toggle-proxy" />
            <span data-i18n="idle.proxyToggle"></span>
          </label>
          <div id="proxy-config" class="hidden">
            <div class="output-settings-row">
              <label for="input-proxy-env-var" data-i18n="idle.proxyEnvVarLabel"></label>
              <input type="text" id="input-proxy-env-var" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
            </div>
            <p class="preview-summary" data-i18n="idle.proxyHint"></p>
          </div>
          <!-- Issue #178: opt-in external XML config file — a plain on/off
               switch, no sub-fields (which values end up editable depends
               entirely on the current mode/shape, not a user choice here).
               The file itself doesn't exist until the generated script's
               first real run, which self-creates it next to itself. -->
          <label class="output-settings-toggle">
            <input type="checkbox" id="toggle-external-config" />
            <span data-i18n="idle.externalConfigToggle"></span>
          </label>
          <p class="preview-summary" data-i18n="idle.externalConfigHint"></p>
          <!-- Issue #174: opt-in classic multi-page pagination — follows
               either a "next page" link (CSS selector, href resolved
               relative to the current page) or a {page}-templated URL,
               starting from each start URL as page 1, until a page yields
               nothing, the safety cap is reached, or (next-link kind) the
               selector stops matching. Hidden entirely for API mode (see
               render()'s own #pagination-toggle-row toggle), same reasoning
               as #additional-urls-row — API mode already has its own page-
               parameter mechanism via a Number RangeSource. -->
          <label class="output-settings-toggle" id="pagination-toggle-row">
            <input type="checkbox" id="toggle-pagination" />
            <span data-i18n="idle.paginationToggle"></span>
          </label>
          <div id="pagination-config" class="hidden">
            <div class="mode-toggle" style="margin-bottom: 8px;">
              <div class="mode-toggle-thumb"></div>
              <button id="btn-pagination-next-link" class="mode-btn active" type="button" data-i18n="idle.paginationKindNextLink"></button>
              <button id="btn-pagination-page-number" class="mode-btn" type="button" data-i18n="idle.paginationKindPageNumber"></button>
            </div>
            <div id="pagination-next-link-fields">
              <div class="output-settings-row">
                <label for="input-pagination-next-link-selector" data-i18n="idle.paginationNextLinkSelectorLabel"></label>
                <input type="text" id="input-pagination-next-link-selector" data-i18n-placeholder="idle.paginationNextLinkSelectorPlaceholder" autocomplete="off" />
              </div>
              <!-- Issue #174 follow-up: lets a non-developer pick the "next
                   page" link by clicking it on the page instead of having to
                   know/type a CSS selector by hand — same click-based
                   selection flow browser actions' own pick button already
                   uses (see .btn-pick-action-selector). -->
              <div class="actions">
                <button id="btn-pick-pagination-next-link" class="btn-secondary btn-tiny" type="button" data-i18n="browserActions.pickSelectorBtn"></button>
              </div>
            </div>
            <div id="pagination-page-number-fields" class="hidden">
              <div class="output-settings-row">
                <label for="input-pagination-url-template" data-i18n="idle.paginationUrlTemplateLabel"></label>
                <input type="text" id="input-pagination-url-template" data-i18n-placeholder="idle.paginationUrlTemplatePlaceholder" autocomplete="off" />
              </div>
              <p class="preview-summary" data-i18n="idle.paginationUrlTemplateHint"></p>
            </div>
            <div class="output-settings-row">
              <label for="input-pagination-max-pages" data-i18n="idle.paginationMaxPagesLabel"></label>
              <input type="number" id="input-pagination-max-pages" min="1" step="1" />
            </div>
          </div>
        </div>
      </div>
      <!-- Issue #183: change detection (#87) and script hardening (#129-
           #133) are grouped into one collapsible section — both are about
           monitoring a script over repeated, unattended runs (change
           detection notifies when the *data* changes between runs,
           hardening catches when the *scrape itself* silently breaks),
           unlike the rest of .output-settings, which is about the one-time
           act of generating the script. Collapsed by default; render()
           auto-expands it once, on the first render after a popup (re)open
           if either change detection or any hardening check is already
           configured (see _state.monitoringSectionOpen/
           computeInitialMonitoringSectionOpen in popup.js) — a returning
           user isn't forced to re-expand it just to see their own
           settings. Reuses the shared chevron+.collapsed convention
           (Issue #139) already used by the group/api/DOM tree views,
           rather than the "Show/Hide" button-text-swap pattern the API
           mode recorded-requests panel uses — a fixed section title that
           expands fits a "collapsible section" better than a panel whose
           own visibility is the primary thing being toggled. -->
      <div id="monitoring-section">
        <div id="monitoring-section-toggle" class="monitoring-section-header" role="button" tabindex="0">
          <span class="monitoring-section-chevron">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
          <span data-i18n="idle.monitoringSectionToggle"></span>
        </div>
        <div id="monitoring-section-content" class="hidden">
          <!-- Issue #87: opt-in change detection + notification — every
               credential/target field below is the *name* of an
               environment variable, never a literal value (mirrors
               FillAction's own environmentVariableName input), read by the
               generated script at runtime via os.environ[...]. -->
          <label class="output-settings-toggle">
            <input type="checkbox" id="toggle-change-detection" />
            <span data-i18n="idle.changeDetectionToggle"></span>
          </label>
          <div id="change-detection-config" class="hidden">
            <div class="mode-toggle" style="margin-bottom: 8px;">
              <div class="mode-toggle-thumb"></div>
              <button id="btn-notify-email" class="mode-btn active" type="button" data-i18n="idle.notifyEmail"></button>
              <button id="btn-notify-webhook" class="mode-btn" type="button" data-i18n="idle.notifyWebhook"></button>
            </div>
            <div id="notify-email-fields">
              <div class="output-settings-row">
                <label for="input-cd-smtp-host" data-i18n="idle.smtpHostEnvVarLabel"></label>
                <input type="text" id="input-cd-smtp-host" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
              </div>
              <div class="output-settings-row">
                <label for="input-cd-smtp-port" data-i18n="idle.smtpPortEnvVarLabel"></label>
                <input type="text" id="input-cd-smtp-port" data-i18n-placeholder="idle.envVarPlaceholderOptional" autocomplete="off" />
              </div>
              <div class="output-settings-row">
                <label for="input-cd-smtp-username" data-i18n="idle.smtpUsernameEnvVarLabel"></label>
                <input type="text" id="input-cd-smtp-username" data-i18n-placeholder="idle.envVarPlaceholderOptional" autocomplete="off" />
              </div>
              <div class="output-settings-row">
                <label for="input-cd-smtp-password" data-i18n="idle.smtpPasswordEnvVarLabel"></label>
                <input type="text" id="input-cd-smtp-password" data-i18n-placeholder="idle.envVarPlaceholderOptional" autocomplete="off" />
              </div>
              <div class="output-settings-row">
                <label for="input-cd-email-from" data-i18n="idle.notifyEmailFromEnvVarLabel"></label>
                <input type="text" id="input-cd-email-from" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
              </div>
              <div class="output-settings-row">
                <label for="input-cd-email-to" data-i18n="idle.notifyEmailToEnvVarLabel"></label>
                <input type="text" id="input-cd-email-to" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
              </div>
            </div>
            <div id="notify-webhook-fields" class="hidden">
              <div class="output-settings-row">
                <label for="input-cd-webhook-url" data-i18n="idle.webhookUrlEnvVarLabel"></label>
                <input type="text" id="input-cd-webhook-url" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
              </div>
            </div>
            <p class="preview-summary" data-i18n="idle.changeDetectionHint"></p>
          </div>
          <!-- Issue #129: opt-in script hardening — the generated script
               re-checks its own result after scraping (e.g. before a
               cron-scheduled re-run, weeks after generation) and either
               warns (script still exits 0) or fails the run (script exits
               a distinct non-zero code) per check, independently
               configurable. This is the first of five planned checks (see
               CLAUDE.md) — one row per check, built so each of the other
               four can add its own row below without restructuring
               #hardening-config. -->
          <div id="hardening-config">
            <label class="output-settings-toggle">
              <input type="checkbox" id="toggle-hardening-no-result" />
              <span data-i18n="idle.hardeningNoResultToggle"></span>
            </label>
            <div id="hardening-no-result-severity" class="mode-toggle hidden" style="margin: 6px 0 8px;">
              <div class="mode-toggle-thumb"></div>
              <button id="btn-hardening-no-result-warning" class="mode-btn active" type="button" data-i18n="idle.hardeningSeverityWarning" data-i18n-title="idle.hardeningSeverityWarningTitle"></button>
              <button id="btn-hardening-no-result-error" class="mode-btn" type="button" data-i18n="idle.hardeningSeverityError" data-i18n-title="idle.hardeningSeverityErrorTitle"></button>
            </div>
            <!-- Issue #130: per-field empty-value-rate check — catches a
                 field whose selector silently starts matching the wrong
                 thing (row/element count stays healthy, but the value is
                 always empty), which #129's own "no result" check above
                 can't detect at all. One row per monitored field, reusing
                 the exact field list already built in the current mode
                 (see collectFieldNames) instead of a free-text field name
                 input. Rows are entirely JS-rendered
                 (renderHardeningNullRateList) — this div is just the mount
                 point. -->
            <div class="output-settings-toggle" style="margin-top: 10px;">
              <span data-i18n="idle.hardeningNullRateSectionLabel"></span>
            </div>
            <div id="hardening-null-rate-list"></div>
            <button type="button" id="btn-add-null-rate-check" class="btn-secondary btn-tiny" data-i18n="idle.hardeningNullRateAddBtn"></button>
            <!-- Issue #131: baseline-drop check — catches a gradual volume
                 drop (e.g. a broken "load more"/pagination selector) that
                 neither #129's "no result" nor #130's per-field null-rate
                 would ever trip, by comparing this run's own result count
                 against the last run's (tracked by the generated script
                 itself in a small sidecar file next to its own output, not
                 sent to/known by the companion at all). Single toggle+
                 severity+percent row, same shape as the "no result" check
                 above (unlike #130's dynamic per-field list). -->
            <label class="output-settings-toggle" style="margin-top: 10px;">
              <input type="checkbox" id="toggle-hardening-baseline" />
              <span data-i18n="idle.hardeningBaselineToggle"></span>
            </label>
            <div id="hardening-baseline-config" class="hidden">
              <div id="hardening-baseline-severity" class="mode-toggle" style="margin: 6px 0 8px;">
                <div class="mode-toggle-thumb"></div>
                <button id="btn-hardening-baseline-warning" class="mode-btn active" type="button" data-i18n="idle.hardeningSeverityWarning" data-i18n-title="idle.hardeningSeverityWarningTitle"></button>
                <button id="btn-hardening-baseline-error" class="mode-btn" type="button" data-i18n="idle.hardeningSeverityError" data-i18n-title="idle.hardeningSeverityErrorTitle"></button>
              </div>
              <label class="browser-action-field-row">
                <span data-i18n="idle.hardeningBaselineThresholdLabel"></span>
                <input type="number" min="0" max="100" id="input-hardening-baseline-threshold" />%
              </label>
            </div>
            <!-- Issue #132: blocking-detection check — catches a site that
                 starts blocking the script (rate-limiting, IP ban, CAPTCHA
                 wall, redirect to a login page) while still responding
                 with a normal-looking HTTP 200, which none of the checks
                 above would necessarily catch. Same single toggle+severity
                 shape as baseline above, plus an optional min-body-length
                 number input and a one-phrase-per-line textarea (a
                 redirect to a different host is always checked, no input
                 needed for that signal). -->
            <label class="output-settings-toggle" style="margin-top: 10px;">
              <input type="checkbox" id="toggle-hardening-blocking" />
              <span data-i18n="idle.hardeningBlockingToggle"></span>
            </label>
            <div id="hardening-blocking-config" class="hidden">
              <div id="hardening-blocking-severity" class="mode-toggle" style="margin: 6px 0 8px;">
                <div class="mode-toggle-thumb"></div>
                <button id="btn-hardening-blocking-warning" class="mode-btn active" type="button" data-i18n="idle.hardeningSeverityWarning" data-i18n-title="idle.hardeningSeverityWarningTitle"></button>
                <button id="btn-hardening-blocking-error" class="mode-btn" type="button" data-i18n="idle.hardeningSeverityError" data-i18n-title="idle.hardeningSeverityErrorTitle"></button>
              </div>
              <label class="browser-action-field-row">
                <span data-i18n="idle.hardeningBlockingMinBodyLengthLabel"></span>
                <input type="number" min="1" id="input-hardening-blocking-min-body-length" data-i18n-placeholder="idle.hardeningBlockingMinBodyLengthPlaceholder" />
              </label>
              <div class="output-settings-row" style="align-items: flex-start; margin-top: 6px;">
                <label for="input-hardening-blocking-phrases" data-i18n="idle.hardeningBlockingPhrasesLabel"></label>
                <textarea id="input-hardening-blocking-phrases" rows="2" data-i18n-placeholder="idle.hardeningBlockingPhrasesPlaceholder"></textarea>
              </div>
            </div>
            <!-- Issue #133 (+ container-mode and, since #204, Api-mode-tree
                 follow-ups): required-fields check — a row (flat/Api-flat
                 mode) or repeating group instance (container mode/Api-tree
                 mode) missing a value for any of these fields is dropped
                 from the output entirely (rather than written with a blank
                 cell), e.g. for a NOT NULL database column. Supported for
                 every mode/shape now, so this section is never hidden.
                 Unlike the null-rate list above (each row its own draft
                 object), a required field is already a complete, chosen
                 name the moment it's in the list — picking a *new* one uses
                 one shared select/button pair instead of a per-row field
                 picker. -->
            <div id="hardening-required-fields-section">
              <label class="output-settings-toggle" style="margin-top: 10px;">
                <input type="checkbox" id="toggle-hardening-required-fields" />
                <span data-i18n="idle.hardeningRequiredFieldsToggle"></span>
              </label>
              <div id="hardening-required-fields-config" class="hidden">
                <div id="hardening-required-fields-severity" class="mode-toggle" style="margin: 6px 0 8px;">
                  <div class="mode-toggle-thumb"></div>
                  <button id="btn-hardening-required-fields-warning" class="mode-btn active" type="button" data-i18n="idle.hardeningSeverityWarning" data-i18n-title="idle.hardeningSeverityWarningTitle"></button>
                  <button id="btn-hardening-required-fields-error" class="mode-btn" type="button" data-i18n="idle.hardeningSeverityError" data-i18n-title="idle.hardeningSeverityErrorTitle"></button>
                </div>
                <div id="hardening-required-fields-list"></div>
                <div class="hardening-required-field-add-row">
                  <select id="select-hardening-required-field"></select>
                  <button type="button" id="btn-add-required-field" class="btn-secondary btn-tiny" data-i18n="idle.hardeningRequiredFieldsAddBtn"></button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Filenames last: a final naming step right before Export/Generate,
           below every other output-settings toggle. -->
      <div class="output-settings-row">
        <label for="input-script-filename" data-i18n="idle.scriptFilenameLabel"></label>
        <input type="text" id="input-script-filename" data-i18n-placeholder="idle.scriptFilenamePlaceholder" autocomplete="off" />
        <span class="output-settings-ext">.py</span>
      </div>
      <div class="output-settings-row">
        <label for="input-output-filename" data-i18n="idle.outputFilenameLabel"></label>
        <input type="text" id="input-output-filename" data-i18n-placeholder="idle.outputFilenamePlaceholder" autocomplete="off" />
        <span id="output-filename-ext" class="output-settings-ext">.csv</span>
      </div>
    </div>
    </div>

    <!-- Issue #141: local SQLite-backed configuration history — save the
         current Fields/Groups/Api config to the companion's local SQLite
         store and reload it later instead of rebuilding selectors from
         scratch every time the same site is scraped. Scoped to the current
         page's hostname (fetchSavedConfigs/SavedConfigStore.ListByUrl).
         "Laden" restores everything buildScrapingConfig captures except
         `url` itself, which always stays whatever the live browser tab
         shows (see config-import.js's applyConfigToState doc comment). -->
    <div id="saved-configs-section">
      <p class="preview-summary" data-i18n="idle.savedConfigsTitle"></p>
      <div id="saved-configs-list"></div>
      <p id="saved-configs-empty" class="preview-summary hidden" data-i18n="idle.savedConfigsEmpty"></p>
    </div>

    <div class="actions" style="margin-top: 10px;">
      <button id="btn-export-config" class="btn-secondary" disabled data-i18n="idle.exportConfigBtn" data-i18n-title="idle.exportConfigTitle"></button>
      <button id="btn-save-config" class="btn-secondary" disabled data-i18n="idle.saveConfigBtn" data-i18n-title="idle.saveConfigTitle"></button>
      <button id="btn-generate" class="btn-primary" disabled data-i18n="idle.generateBtn"></button>
    </div>
  </section>

  <!-- SELECTING -->
  <section id="screen-selecting" class="screen hidden">
    <p class="selecting-hint" data-i18n="selecting.hint"></p>
    <label class="dom-view-toggle">
      <input type="checkbox" id="toggle-dom-view" />
      <span data-i18n="selecting.domTreeToggle"></span>
    </label>
    <div id="dom-tree-wrapper" class="dom-tree-wrapper hidden">
      <p id="dom-tree-loading" class="dom-tree-loading" data-i18n="selecting.domTreeLoading"></p>
      <p id="dom-tree-error" class="dom-tree-error hidden">
        <span data-i18n="selecting.domTreeError"></span>
        <button id="btn-report-bug-domtree" class="report-bug-link" data-i18n="common.reportBug"></button>
      </p>
      <p id="dom-tree-truncated" class="dom-tree-truncated hidden" data-i18n="selecting.domTreeTruncated"></p>
      <ul id="dom-tree-root" class="dom-tree"></ul>
    </div>
    <button id="btn-cancel-selection" class="btn-secondary" data-i18n="selecting.cancelBtn"></button>
  </section>

  <!-- API_CONFIG (Issue #53 Phase 5) — configuring a confirmed candidate
       into an ApiConfig. Reached from the api-mode-section's "Verwenden"
       flow (see screen-idle above), which only shows once mode === 'api'. -->
  <section id="screen-api-config" class="screen hidden">
    <!-- Issue #136: shown only when this ApiConfig was sourced from an
         embedded <script> tag instead of a live network request — clarifies
         why the URL segments below describe a plain page load, not an API
         call. -->
    <p id="api-config-embedded-json-note" class="preview-summary hidden"></p>

    <!-- Nested JSON tree editor (Issue #54) — subsumes the old flat field
         list entirely (Phase A5): a single top-level match renders as a
         one-node-deep tree, visually almost identical to the old list but
         wrapped in the same tree-editor chrome every deeper level reuses. -->
    <div class="row-label" data-i18n="common.fields"></div>
    <ul id="api-tree-root" class="api-tree"></ul>
    <div class="actions">
      <button id="btn-api-tree-add-root" class="btn-secondary btn-tiny" type="button" data-i18n="apiTree.addRootGroupBtn"></button>
    </div>
    <!-- Results of an "add root group"/"add sub-field" search started from
         this screen (see btn-api-tree-add-root and the tree's own per-row
         add buttons) — same markup/behavior as the primary search's
         api-candidates-panel on screen-idle, see renderApiCandidates. -->
    <div id="api-tree-search-panel" class="api-candidates-panel hidden">
      <p id="api-tree-search-target" class="api-candidates-target"></p>
      <ul id="api-tree-search-list" class="api-candidates-list"></ul>
    </div>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.urlPathLabel"></div>
    <ul id="api-config-segments" class="api-config-parts"></ul>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.urlQueryLabel"></div>
    <ul id="api-config-query-params" class="api-config-parts"></ul>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.valueSourcesLabel"></div>
    <div id="api-config-parameters"></div>

    <!-- Request-body tree (Issue #55, Phase B4) — only shown for a POST
         candidate whose captured request body could be turned into a draft
         (see loadInitialBodyTreeForCandidate); hidden entirely for a GET
         config or an unparsable/bodyless POST. -->
    <div id="api-config-body-section" class="hidden">
      <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.bodyLabel"></div>
      <ul id="body-tree-root" class="body-tree"></ul>
    </div>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.headersLabel"></div>
    <ul id="api-config-headers" class="api-config-headers"></ul>

    <div class="actions" style="margin-top: 12px;">
      <button id="btn-api-config-cancel" class="btn-secondary" type="button" data-i18n="common.cancel"></button>
      <button id="btn-api-config-confirm" class="btn-primary" type="button" disabled data-i18n="common.apply"></button>
    </div>
  </section>

  <!-- GENERATING -->
  <section id="screen-generating" class="screen hidden">
    <div class="spinner"></div>
    <p data-i18n="generating.message"></p>
  </section>

  <!-- DONE -->
  <section id="screen-done" class="screen hidden">
    <p class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="7 12.5 10.5 16 17 8"></polyline>
      </svg>
    </p>
    <p data-i18n="done.title"></p>
    <div class="done-actions">
      <!-- Returns to IDLE with the just-used configuration (fields/groups/
           apiConfig/url/output-settings) left untouched, unlike btn-new-
           scraper's full reset — for when the sample data preview isn't
           quite right and a selector/transform needs tweaking before
           regenerating, without starting the whole scraper over. -->
      <button id="btn-back-to-config" class="btn-secondary" data-i18n="done.backBtn"></button>
      <button id="btn-new-scraper" class="btn-secondary" data-i18n="done.newBtn"></button>
      <button id="btn-download" class="btn-primary" data-i18n="done.downloadBtn"></button>
      <!-- Issue #161: only shown when includeOutputFile was checked before
           Generate — the companion's actual, complete trial-run output,
           downloadable directly without ever running the generated script
           locally. -->
      <button id="btn-download-output" class="btn-primary hidden" data-i18n="done.downloadOutputBtn"></button>
      <!-- Issue #202: same visibility gate as btn-download-output — opens
           modal-save-output to link this run's output to a saved
           configuration in the companion's local SQLite store, instead of
           only ever downloading it to disk. -->
      <button id="btn-save-output" class="btn-secondary hidden" data-i18n="done.saveOutputBtn"></button>
    </div>

    <!-- Issue #122: trial-run data preview — populated by renderDataPreview,
         hidden entirely when includeDataPreview was off for this /generate
         (or an older companion doesn't support it yet). -->
    <div id="data-preview-panel" class="data-preview-panel hidden">
      <p class="data-preview-title" data-i18n="done.dataPreviewTitle"></p>
      <div id="data-preview-table-wrap" class="data-preview-table-wrap hidden"></div>
      <!-- Issue #86: also holds the Json tree-shape sample, not just Xml —
           see renderDataPreview's own doc comment. -->
      <pre id="data-preview-text" class="data-preview-text hidden"></pre>
      <p id="data-preview-truncated" class="data-preview-truncated hidden"></p>
    </div>
  </section>

  <!-- Modal: field-name input -->
  <div id="modal-field-name" class="modal hidden">
    <div class="modal-inner">
      <label for="input-field-name" data-i18n="modals.fieldName.label"></label>
      <input id="input-field-name" type="text" data-i18n-placeholder="modals.fieldName.placeholder" autocomplete="off" />
      <!-- Issue #85: live match count for the just-picked selector -->
      <p id="field-name-match-count" class="match-count-hint hidden"></p>
      <!-- Issue #84: optional per-field transform chain -->
      <div class="field-transforms-section">
        <label data-i18n="transforms.sectionLabel"></label>
        <ul id="field-transform-list" class="field-transform-list"></ul>
        <button type="button" id="btn-field-transform-add" class="btn-secondary btn-tiny" data-i18n="transforms.addBtn"></button>
        <!-- Issue #143: live preview of the chain's output against the picked element's raw value -->
        <p id="field-transform-preview" class="transform-preview hidden"></p>
      </div>
      <div class="modal-actions">
        <button id="btn-field-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-field-confirm" class="btn-primary" data-i18n="common.add"></button>
      </div>
    </div>
  </div>

  <!-- Modal: new container (name + type), shown before element selection starts -->
  <!-- Modal: name a config being saved to the companion's local SQLite
       store (Issue #141) -->
  <div id="modal-save-config" class="modal hidden">
    <div class="modal-inner">
      <label for="input-save-config-name" data-i18n="modals.saveConfig.label"></label>
      <input id="input-save-config-name" type="text" data-i18n-placeholder="modals.saveConfig.namePlaceholder" autocomplete="off" />
      <div class="modal-actions">
        <button id="btn-save-config-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-save-config-confirm" class="btn-primary" data-i18n="modals.saveConfig.save"></button>
      </div>
    </div>
  </div>

  <!-- Modal: link the DONE screen's trial-run output to a saved
       configuration and give it a name (Issue #202). Shown only once
       includeOutputFile actually produced a file (see btn-save-output's own
       visibility gate) — see renderSaveOutputModal for how it switches
       between the config-picker form below and the "no saved config yet"
       hint. -->
  <div id="modal-save-output" class="modal hidden">
    <div class="modal-inner">
      <div id="save-output-picker">
        <label for="select-save-output-config" data-i18n="modals.saveOutput.configLabel"></label>
        <select id="select-save-output-config"></select>
        <label for="input-save-output-name" data-i18n="modals.saveOutput.nameLabel"></label>
        <input id="input-save-output-name" type="text" data-i18n-placeholder="modals.saveOutput.namePlaceholder" autocomplete="off" />
      </div>
      <p id="save-output-no-configs-hint" class="preview-summary hidden" data-i18n="modals.saveOutput.noConfigsHint"></p>
      <div class="modal-actions">
        <button id="btn-save-output-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-save-output-go-to-save-config" class="btn-primary hidden" data-i18n="modals.saveOutput.saveConfigShortcut"></button>
        <button id="btn-save-output-confirm" class="btn-primary" data-i18n="modals.saveOutput.save"></button>
      </div>
    </div>
  </div>

  <div id="modal-container-new" class="modal hidden">
    <div class="modal-inner">
      <label for="input-container-name" data-i18n="modals.containerNew.label"></label>
      <input id="input-container-name" type="text" data-i18n-placeholder="modals.containerNew.namePlaceholder" autocomplete="off" />
      <label data-i18n="modals.containerNew.typeLabel"></label>
      <div class="radio-row">
        <label><input type="radio" name="container-type" id="radio-container-single" checked /> <span data-i18n="modals.containerNew.single"></span></label>
        <label><input type="radio" name="container-type" id="radio-container-repeating" /> <span data-i18n="modals.containerNew.repeating"></span></label>
      </div>
      <div class="modal-actions">
        <button id="btn-container-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-container-confirm" class="btn-primary" data-i18n="modals.containerNew.next"></button>
      </div>
    </div>
  </div>

  <!-- Modal: extended field input (Container-Mode) — name, type, optional attribute -->
  <div id="modal-field-extended" class="modal hidden">
    <div class="modal-inner">
      <label for="input-field-extended-name" data-i18n="modals.fieldExtended.label"></label>
      <input id="input-field-extended-name" type="text" data-i18n-placeholder="modals.fieldExtended.placeholder" autocomplete="off" />
      <label for="select-field-mode" data-i18n="modals.fieldExtended.typeLabel"></label>
      <select id="select-field-mode">
        <option value="text" data-i18n="modals.fieldExtended.textOption"></option>
        <option value="attribute" data-i18n="modals.fieldExtended.attributeOption"></option>
        <option value="exists" data-i18n="modals.fieldExtended.existsOption"></option>
        <!-- Issue #169: extracts only an element's direct text-node
             children, excluding text contributed by any nested element
             (e.g. a badge <span> inside a name heading) — see
             ExtractMode.OwnText's own doc comment on the companion side. -->
        <option value="ownText" data-i18n="modals.fieldExtended.ownTextOption"></option>
      </select>
      <div id="field-attribute-row" class="hidden">
        <label for="input-field-attribute" data-i18n="modals.fieldExtended.attributeLabel"></label>
        <input id="input-field-attribute" type="text" data-i18n-placeholder="modals.fieldExtended.attributePlaceholder" autocomplete="off" />
      </div>
      <!-- Issue #85: live match count for the just-picked selector -->
      <p id="field-extended-match-count" class="match-count-hint hidden"></p>
      <!-- Issue #84: optional per-field transform chain — hidden for
           "Vorhanden?" (mode === 'exists'), a boolean-ish presence check
           rather than a string pipeline. -->
      <div id="field-extended-transforms-section" class="field-transforms-section">
        <label data-i18n="transforms.sectionLabel"></label>
        <ul id="field-extended-transform-list" class="field-transform-list"></ul>
        <button type="button" id="btn-field-extended-transform-add" class="btn-secondary btn-tiny" data-i18n="transforms.addBtn"></button>
        <!-- Issue #143: live preview of the chain's output against the picked element's raw value -->
        <p id="field-extended-transform-preview" class="transform-preview hidden"></p>
      </div>
      <div class="modal-actions">
        <button id="btn-field-extended-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-field-extended-confirm" class="btn-primary" data-i18n="common.add"></button>
      </div>
    </div>
  </div>

  <!-- Modal: new API-tree sub-group (Issue #54, Phase A5) — name and JSON
       path both typed directly, no click-based search: unlike a field/root
       search there's no single clicked value to derive an empty group from
       without also implying a leaf field nobody asked for (see
       confirmApiGroupModal's own doc comment). -->
  <div id="modal-api-group-new" class="modal hidden">
    <div class="modal-inner">
      <label for="input-api-group-name" data-i18n="modals.apiGroupNew.nameLabel"></label>
      <input id="input-api-group-name" type="text" data-i18n-placeholder="modals.apiGroupNew.namePlaceholder" autocomplete="off" />
      <label for="input-api-group-path" data-i18n="modals.apiGroupNew.pathLabel"></label>
      <input id="input-api-group-path" type="text" data-i18n-placeholder="modals.apiGroupNew.pathPlaceholder" autocomplete="off" />
      <div class="modal-actions">
        <button id="btn-api-group-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-api-group-confirm" class="btn-primary" data-i18n="modals.apiGroupNew.confirm"></button>
      </div>
    </div>
  </div>

  <!-- Modal: new body-only parameter name (Issue #55, Phase B4) — a body
       variable can bind to an already-declared URL parameter, or create a
       new one that exists purely to be referenced from the body; its value
       source is then configured via the exact same parameter-source card a
       URL variable part already uses (see allParameterParts/
       renderApiConfigParameters), not a second body-specific source picker. -->
  <div id="modal-api-body-parameter-new" class="modal hidden">
    <div class="modal-inner">
      <label for="input-api-body-parameter-name" data-i18n="modals.apiBodyParameterNew.nameLabel"></label>
      <input id="input-api-body-parameter-name" type="text" data-i18n-placeholder="modals.apiBodyParameterNew.namePlaceholder" autocomplete="off" />
      <div class="modal-actions">
        <button id="btn-api-body-parameter-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-api-body-parameter-confirm" class="btn-primary" data-i18n="common.add"></button>
      </div>
    </div>
  </div>

  <!-- Modal: API-mode field transforms (Issue #84 follow-up) — reuses the
       exact same transform-chain editor as modal-field-name/-extended
       (field-transforms.js/field-transforms-ui.js), opened via the
       "Transformieren" button next to each field in the API_CONFIG tree. -->
  <div id="modal-api-field-transforms" class="modal hidden">
    <div class="modal-inner">
      <div class="field-transforms-section">
        <label data-i18n="transforms.sectionLabel"></label>
        <ul id="api-field-transform-list" class="field-transform-list"></ul>
        <button type="button" id="btn-api-field-transforms-add" class="btn-secondary btn-tiny" data-i18n="transforms.addBtn"></button>
        <!-- Issue #147: live preview against the field's captured sample value -->
        <p id="api-field-transform-preview" class="transform-preview hidden"></p>
      </div>
      <div class="modal-actions">
        <button id="btn-api-field-transforms-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-api-field-transforms-confirm" class="btn-primary" data-i18n="common.apply"></button>
      </div>
    </div>
  </div>

  <!-- Error toast -->
  <div id="error-toast" class="toast hidden">
    <span id="error-toast-message"></span>
    <button id="btn-report-bug-toast" class="toast-report-btn hidden" data-i18n="common.reportBug"></button>
  </div>

  <script src="../shared/logger.js"></script>
  <script src="../shared/companion-config.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="../i18n/i18n.js"></script>
  <script src="api-config.js"></script>
  <script src="container-tree.js"></script>
  <script src="field-transforms.js"></script>
  <script src="field-transforms-ui.js"></script>
  <script src="api-config-ui.js"></script>
  <script src="container-tree-ui.js"></script>
  <script src="config-import.js"></script>
  <script src="toast.js"></script>
  <script src="bug-report.js"></script>
  <script src="scraping-config-builder.js"></script>
  <script src="dom-tree-ui.js"></script>
  <script src="preview.js"></script>
  <script src="companion-client.js"></script>
  <script src="download-helpers.js"></script>
  <script src="saved-configs-ui.js"></script>
  <script src="settings-panel-ui.js"></script>
  <script src="flat-mode-ui.js"></script>
  <script src="browser-actions-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
