<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Scraping Factory</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Language selector: rendered outside every .screen section so switching
       language is always possible, regardless of app state (checking,
       error, idle, …). See popup.js's applyStaticTranslations/setLanguage. -->
  <div id="lang-switcher">
    <!-- Theme toggle (Issue #140): cycles system -> light -> dark -> system
         on click (SFTheme.cycleTheme); the icon shown always reflects the
         *current* state, same as the language <select>'s own value does —
         see popup.js's renderThemeToggle. -->
    <button id="theme-toggle" type="button" data-i18n-title="theme.toggleTitle"></button>
    <select id="lang-select" aria-label="Language / Sprache / Idioma" title="Language / Sprache / Idioma">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
  </div>

  <!-- CHECKING_COMPANION -->
  <section id="screen-checking" class="screen">
    <div class="spinner"></div>
    <p data-i18n="checking.message"></p>
  </section>

  <!-- COMPANION_ERROR -->
  <section id="screen-error" class="screen hidden">
    <p class="error-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="12 3 22 20 2 20"></polygon>
        <line x1="12" y1="9" x2="12" y2="14"></line>
        <circle cx="12" cy="17.3" r="0.6" fill="currentColor" stroke="none"></circle>
      </svg>
    </p>
    <p data-i18n="error.title"></p>
    <p class="error-hint" data-i18n="error.hint"></p>
    <p id="error-current-url" class="error-current-url"></p>
    <div class="actions">
      <button id="btn-retry" class="btn-primary" data-i18n="common.retry"></button>
      <button id="btn-report-bug-error" class="btn-secondary" data-i18n="common.reportBug"></button>
    </div>
    <div class="companion-url-override">
      <label for="input-companion-url" data-i18n="error.customUrlLabel"></label>
      <input type="text" id="input-companion-url" data-i18n-placeholder="error.customUrlPlaceholder" autocomplete="off" />
      <div class="actions">
        <button id="btn-use-companion-url" class="btn-secondary" data-i18n="error.useCustomUrl"></button>
        <button id="btn-reset-companion-url" class="btn-secondary" data-i18n="error.resetCustomUrl"></button>
      </div>
    </div>
  </section>

  <!-- IDLE -->
  <section id="screen-idle" class="screen hidden">
  </section>

  <!-- SELECTING -->
  <section id="screen-selecting" class="screen hidden">
    <p class="selecting-hint" data-i18n="selecting.hint"></p>
    <label class="dom-view-toggle">
      <input type="checkbox" id="toggle-dom-view" />
      <span data-i18n="selecting.domTreeToggle"></span>
    </label>
    <div id="dom-tree-wrapper" class="dom-tree-wrapper hidden">
      <p id="dom-tree-loading" class="dom-tree-loading" data-i18n="selecting.domTreeLoading"></p>
      <p id="dom-tree-error" class="dom-tree-error hidden">
        <span data-i18n="selecting.domTreeError"></span>
        <button id="btn-report-bug-domtree" class="report-bug-link" data-i18n="common.reportBug"></button>
      </p>
      <p id="dom-tree-truncated" class="dom-tree-truncated hidden" data-i18n="selecting.domTreeTruncated"></p>
      <ul id="dom-tree-root" class="dom-tree"></ul>
    </div>
    <button id="btn-cancel-selection" class="btn-secondary" data-i18n="selecting.cancelBtn"></button>
  </section>

  <!-- API_CONFIG (Issue #53 Phase 5) — configuring a confirmed candidate
       into an ApiConfig. Reached from the api-mode-section's "Verwenden"
       flow (see screen-idle above), which only shows once mode === 'api'. -->
  <section id="screen-api-config" class="screen hidden">
  </section>

  <!-- GENERATING -->
  <section id="screen-generating" class="screen hidden">
    <div class="spinner"></div>
    <p data-i18n="generating.message"></p>
  </section>

  <!-- DONE -->
  <section id="screen-done" class="screen hidden">
    <p class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="7 12.5 10.5 16 17 8"></polyline>
      </svg>
    </p>
    <p data-i18n="done.title"></p>
    <div class="done-actions">
      <!-- Returns to IDLE with the just-used configuration (fields/groups/
           apiConfig/url/output-settings) left untouched, unlike btn-new-
           scraper's full reset — for when the sample data preview isn't
           quite right and a selector/transform needs tweaking before
           regenerating, without starting the whole scraper over. -->
      <button id="btn-back-to-config" class="btn-secondary" data-i18n="done.backBtn"></button>
      <button id="btn-new-scraper" class="btn-secondary" data-i18n="done.newBtn"></button>
      <button id="btn-download" class="btn-primary" data-i18n="done.downloadBtn"></button>
      <!-- Issue #161: only shown when includeOutputFile was checked before
           Generate — the companion's actual, complete trial-run output,
           downloadable directly without ever running the generated script
           locally. -->
      <button id="btn-download-output" class="btn-primary hidden" data-i18n="done.downloadOutputBtn"></button>
      <!-- Issue #202: same visibility gate as btn-download-output — opens
           modal-save-output to link this run's output to a saved
           configuration in the companion's local SQLite store, instead of
           only ever downloading it to disk. -->
      <button id="btn-save-output" class="btn-secondary hidden" data-i18n="done.saveOutputBtn"></button>
    </div>

    <!-- Issue #122: trial-run data preview — populated by renderDataPreview,
         hidden entirely when includeDataPreview was off for this /generate
         (or an older companion doesn't support it yet). -->
    <div id="data-preview-panel" class="data-preview-panel hidden">
      <p class="data-preview-title" data-i18n="done.dataPreviewTitle"></p>
      <div id="data-preview-table-wrap" class="data-preview-table-wrap hidden"></div>
      <!-- Issue #86: also holds the Json tree-shape sample, not just Xml —
           see renderDataPreview's own doc comment. -->
      <pre id="data-preview-text" class="data-preview-text hidden"></pre>
      <p id="data-preview-truncated" class="data-preview-truncated hidden"></p>
    </div>
  </section>

  <div id="modals-mount"></div>
  <!-- Error toast -->
  <div id="error-toast" class="toast hidden">
    <span id="error-toast-message"></span>
    <button id="btn-report-bug-toast" class="toast-report-btn hidden" data-i18n="common.reportBug"></button>
  </div>

  <script src="../shared/logger.js"></script>
  <script src="../shared/companion-config.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="../i18n/i18n.js"></script>
  <script src="api-config.js"></script>
  <script src="container-tree.js"></script>
  <script src="field-transforms.js"></script>
  <script src="field-transforms-ui.js"></script>
  <script src="api-config-ui.js"></script>
  <script src="container-tree-ui.js"></script>
  <script src="config-import.js"></script>
  <script src="toast.js"></script>
  <script src="bug-report.js"></script>
  <script src="scraping-config-builder.js"></script>
  <script src="dom-tree-ui.js"></script>
  <script src="preview.js"></script>
  <script src="companion-client.js"></script>
  <script src="download-helpers.js"></script>
  <script src="saved-configs-ui.js"></script>
  <script src="settings-panel-ui.js"></script>
  <script src="flat-mode-ui.js"></script>
  <script src="browser-actions-ui.js"></script>
  <script src="idle-screen-ui.js"></script>
  <script src="message-router.js"></script>
  <script src="popup.js"></script>
</body>
</html>
