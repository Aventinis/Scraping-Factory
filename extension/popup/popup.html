<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Scraping Factory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      width: 100%;
      max-width: 380px;
      min-width: 280px;
      background: #fff;
      color: #1a1a1a;
    }
    .screen { padding: 16px; }
    .hidden { display: none !important; }

    /* Spinner */
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #screen-checking, #screen-generating {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 120px; text-align: center; color: #6b7280;
    }

    /* Error screen */
    #screen-error { text-align: center; padding: 24px 16px; }
    .error-icon  { font-size: 32px; margin-bottom: 8px; }
    .error-hint  { color: #6b7280; font-size: 13px; margin: 6px 0 16px; }

    /* URL row */
    .url-row     { margin-bottom: 14px; }
    .row-label   { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #9ca3af; margin-bottom: 2px; }
    .url-value   { font-size: 12px; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #btn-check-robots  { margin-top: 6px; }
    .robots-txt-result     { font-size: 11px; margin-top: 6px; }
    .robots-txt-allowed    { color: #16a34a; }
    .robots-txt-disallowed { color: #ef4444; }
    .robots-txt-unknown    { color: #9ca3af; }

    /* Fields */
    #fields-list { margin-bottom: 12px; min-height: 4px; }
    .field-row {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px; background: #f9fafb; border-radius: 6px; margin-bottom: 4px;
    }
    .field-name     { font-weight: 500; min-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .field-selector { flex: 1; font-size: 11px; font-family: monospace; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Frame-path indicator (Issue #42, Phase 7) — flags a field/node/action
       whose selector was picked inside an iframe (see FramePath on the wire
       format); the amber tone matches content-script.js's own in-page
       overlay/badge color for the same concept. */
    .frame-badge {
      flex: none; font-size: 10px; padding: 1px 6px; border-radius: 999px;
      background: #fef3c7; color: #b45309; white-space: nowrap;
    }

    /* Mode toggle */
    .mode-toggle { display: flex; gap: 4px; margin-bottom: 14px; background: #f3f4f6; border-radius: 8px; padding: 3px; }
    .mode-btn {
      flex: 1; background: transparent; color: #6b7280; font-size: 12px; padding: 6px 8px; border-radius: 6px;
    }
    .mode-btn.active { background: #fff; color: #1a1a1a; box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 500; }

    /* Engine toggle + browser actions (Issue #41/#42, Phase 5) */
    .engine-section { margin-bottom: 14px; }
    .browser-actions-hint { font-size: 11px; color: #6b7280; margin-bottom: 8px; }
    .browser-action-card { padding: 8px; background: #f9fafb; border-radius: 6px; margin-bottom: 6px; }
    .browser-action-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .browser-action-selector-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .browser-action-selector-row label { flex: none; width: 60px; font-size: 11px; color: #6b7280; }
    .browser-action-selector-row .field-selector { flex: 1; background: #fff; border: 1px solid #e5e7eb; border-radius: 4px; padding: 3px 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .browser-action-field-row { display: flex; align-items: center; gap: 6px; }
    .browser-action-field-row label { flex: none; font-size: 11px; color: #6b7280; }
    .browser-action-field-row input { flex: 1; min-width: 0; font-size: 11px; padding: 3px 6px; border: 1px solid #e5e7eb; border-radius: 4px; }
    .browser-action-hint { font-size: 10px; color: #9ca3af; margin: 4px 0 0; }

    /* Preview toggle */
    .btn-toggle           { background: #f3f4f6; color: #374151; width: 100%; }
    .btn-toggle:hover     { background: #e5e7eb; }
    .btn-toggle:disabled  { color: #9ca3af; cursor: default; }
    .btn-toggle.active         { background: #3b82f6; color: #fff; }
    .btn-toggle.active:hover   { background: #2563eb; }
    .preview-summary { font-size: 11px; color: #6b7280; margin-top: 6px; text-align: center; }
    .preview-summary.warn { color: #d97706; }

    /* API-mode candidate search (Phase 4) */
    .api-candidates-panel { margin-top: 8px; padding: 8px; background: #f9fafb; border-radius: 6px; }
    .api-candidates-target { font-size: 11px; color: #6b7280; margin-bottom: 6px; word-break: break-word; }
    .api-candidates-list { list-style: none; }
    .api-candidate { padding: 6px; background: #fff; border-radius: 6px; margin-bottom: 4px; font-size: 11px; }
    .api-candidate:last-child { margin-bottom: 0; }
    .api-candidate-url { font-family: monospace; color: #374151; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .api-candidate-path { font-family: monospace; color: #3b82f6; margin-top: 2px; }
    .api-candidate-body { font-family: monospace; color: #6b7280; margin-top: 2px; word-break: break-word; white-space: pre-wrap; }
    .api-candidate-body-skipped { color: #9ca3af; font-style: italic; }
    .api-candidate-value { color: #6b7280; margin-top: 2px; word-break: break-word; }
    .api-candidate-siblings { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .api-sibling-chip {
      font-size: 10px; padding: 2px 6px; background: #f3f4f6; color: #374151; border-radius: 999px;
    }
    .api-sibling-chip:hover { background: #e5e7eb; }
    .api-sibling-chip.picked { background: #3b82f6; color: #fff; }
    .api-sibling-select-all {
      font-size: 10px; padding: 2px 6px; background: none; color: #3b82f6; border: 1px dashed #93c5fd; border-radius: 999px;
    }
    .api-sibling-select-all:hover { background: #eff6ff; }
    .api-candidates-empty { font-size: 11px; color: #9ca3af; text-align: center; padding: 4px 0; }
    .api-candidate-use { display: flex; gap: 4px; margin-top: 6px; }
    .api-candidate-field-name { flex: 1; font-size: 11px; padding: 3px 6px; border: 1px solid #e5e7eb; border-radius: 4px; }
    .api-candidate-unusable { font-size: 10px; color: #9ca3af; margin-top: 6px; }

    /* API-mode config screen (Phase 5) */
    #screen-api-config { padding: 16px; max-height: 480px; overflow-y: auto; }
    .api-config-parts, .api-config-headers { list-style: none; margin-bottom: 4px; }
    .api-config-part-row, .api-config-header-row {
      display: flex; align-items: center; gap: 6px; padding: 5px 6px; background: #f9fafb; border-radius: 6px; margin-bottom: 4px; font-size: 11px;
    }
    .api-config-part-value { flex: 1; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .api-config-part-name { width: 90px; font-size: 11px; padding: 3px 6px; border: 1px solid #e5e7eb; border-radius: 4px; }
    .api-config-param-card { padding: 8px; background: #f9fafb; border-radius: 6px; margin-bottom: 6px; }
    .api-config-param-card .row-label { margin-bottom: 4px; }
    .api-config-source-kind { display: flex; gap: 10px; font-size: 11px; margin-bottom: 6px; }
    .api-config-source-fields textarea { width: 100%; font-size: 11px; padding: 4px 6px; border: 1px solid #e5e7eb; border-radius: 4px; font-family: monospace; }
    .api-config-source-fields .api-config-autofill-pool { margin-top: 4px; }
    .api-config-source-fields input[type="text"] { font-size: 11px; padding: 3px 6px; border: 1px solid #e5e7eb; border-radius: 4px; }
    .api-config-range-row { display: flex; gap: 6px; margin-top: 4px; }
    .api-config-range-row input, .api-config-range-row select { flex: 1; }
    .api-config-range-format-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .api-config-range-format-row select, .api-config-range-format-row input[type="text"] { flex: 1; }
    .api-config-range-format-example { flex-basis: 100%; margin: 2px 0 0; font-size: 11px; color: #6b7280; }
    .api-config-header-row .api-config-header-name { flex: 1; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .api-config-header-mode { display: flex; gap: 6px; }
    .api-config-env-name { width: 90px; font-size: 11px; padding: 3px 6px; border: 1px solid #e5e7eb; border-radius: 4px; }

    /* Container tree editor */
    #group-tree-root { list-style: none; margin: 0 0 10px; padding: 0; }
    .group-tree-children { list-style: none; margin: 0; padding: 0; }
    .group-tree-children.hidden { display: none; }
    .group-tree-row {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding: 4px 2px; font-size: 12px; color: #374151;
    }
    .group-tree-toggle { width: 12px; flex: none; color: #9ca3af; cursor: pointer; user-select: none; }
    .group-tree-label  { flex: 1; min-width: 60px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-tiny { font-size: 11px; padding: 3px 6px; }

    /* API-Mode tree editor (Issue #54) — same visual pattern as the Container
       tree editor above, no repeating/attribute/mode label or frame badge. */
    #api-tree-root { list-style: none; margin: 0 0 10px; padding: 0; }
    .api-tree-children { list-style: none; margin: 0; padding: 0; }
    .api-tree-children.hidden { display: none; }
    .api-tree-row {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding: 4px 2px; font-size: 12px; color: #374151;
    }
    .api-tree-toggle { width: 12px; flex: none; color: #9ca3af; cursor: pointer; user-select: none; }
    .api-tree-name { min-width: 70px; font-weight: 500; font-size: 11px; padding: 3px 6px; border: 1px solid #e5e7eb; border-radius: 4px; }
    .api-tree-path { flex: 1; min-width: 60px; font-family: monospace; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* API-Mode request-body tree editor (Issue #55) — same visual pattern
       as the API-Mode response tree above, no toggle arrow (every node
       starts fully expanded, bodies are typically small) and no per-row
       add/remove (the body's own shape is never edited, only a leaf's
       fixed/variable state — see jsonValueToBodyDraft's doc comment). */
    #body-tree-root { list-style: none; margin: 0 0 10px; padding: 0; }
    .body-tree-children { list-style: none; margin: 0; padding: 0; }
    .body-tree-row {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding: 4px 2px; font-size: 12px; color: #374151;
    }
    .body-tree-label { flex: 1; min-width: 60px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .body-tree-parameter-picker, .body-tree-coerce-to { font-size: 11px; padding: 2px 4px; }

    /* Radio row (container-type picker) — specificity beats .modal-inner label's block display */
    .radio-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-size: 13px; color: #374151; }
    .modal-inner .radio-row label { display: flex; align-items: center; gap: 6px; font-size: inherit; margin-bottom: 0; }

    /* Selecting screen */
    #screen-selecting { text-align: center; padding: 28px 16px; }
    .selecting-hint   { color: #6b7280; margin-bottom: 16px; }

    /* DOM tree view */
    .dom-view-toggle {
      display: flex; align-items: center; gap: 6px; justify-content: center;
      font-size: 12px; color: #374151; margin-bottom: 10px; cursor: pointer;
    }
    .dom-tree-wrapper {
      text-align: left; max-height: 220px; overflow: auto;
      border: 1px solid #e5e7eb; border-radius: 6px; padding: 6px 8px;
      margin-bottom: 12px; background: #f9fafb;
    }
    .dom-tree-loading, .dom-tree-truncated {
      font-size: 12px; color: #9ca3af; margin: 2px 0 4px;
    }
    .dom-tree-error { font-size: 12px; color: #ef4444; margin: 2px 0 4px; }
    .dom-tree, .dom-tree-children { list-style: none; margin: 0; padding: 0; }
    .dom-tree-children.hidden { display: none; }
    .dom-tree-row {
      display: flex; align-items: center; gap: 4px;
      font-family: monospace; font-size: 12px; color: #374151;
      padding: 1px 2px; border-radius: 3px; cursor: default;
    }
    .dom-tree-toggle {
      width: 12px; flex: none; color: #9ca3af; cursor: pointer; user-select: none;
    }
    .dom-tree-row.hover    { background: rgba(59,130,246,0.15); }
    .dom-tree-row.selected { background: rgba(34,197,94,0.2); font-weight: 600; }

    /* Output settings (script/output filename) — shared across all three modes */
    .output-settings     { margin: 12px 0; }
    .output-settings-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .output-settings-row label { flex: none; width: 110px; font-size: 11px; color: #6b7280; }
    .output-settings-row input[type="text"] {
      flex: 1; min-width: 0; border: 1px solid #d1d5db; border-radius: 6px;
      padding: 5px 8px; font-size: 12px; font-family: inherit; outline: none;
    }
    .output-settings-row input[type="text"]:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.2); }
    .output-settings-ext { flex: none; font-size: 12px; color: #9ca3af; }

    /* Done screen */
    #screen-done    { text-align: center; padding: 24px 16px; }
    .success-icon   { font-size: 32px; color: #22c55e; margin-bottom: 8px; }
    .done-actions   { display: flex; gap: 8px; margin-top: 16px; justify-content: center; }

    /* Buttons */
    button {
      border: none; border-radius: 6px; cursor: pointer;
      font-size: 13px; padding: 7px 12px; font-family: inherit; transition: background .1s;
    }
    .btn-primary             { background: #3b82f6; color: #fff; }
    .btn-primary:hover       { background: #2563eb; }
    .btn-primary:disabled    { background: #93c5fd; cursor: default; }
    .btn-secondary           { background: #f3f4f6; color: #374151; }
    .btn-secondary:hover     { background: #e5e7eb; }
    .btn-danger              { background: transparent; color: #ef4444; font-size: 12px; padding: 3px 6px; }
    .btn-danger:hover        { background: #fee2e2; }

    .actions { display: flex; gap: 8px; }
    .actions .btn-primary  { flex: 1; }
    .actions .btn-secondary { flex: 1; }

    /* Modal */
    .modal {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }
    .modal-inner {
      background: #fff; border-radius: 10px; padding: 18px;
      width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }
    .modal-inner label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 6px; }
    .modal-inner input {
      width: 100%; border: 1px solid #d1d5db; border-radius: 6px;
      padding: 7px 10px; font-size: 14px; margin-bottom: 12px; font-family: inherit; outline: none;
    }
    .modal-inner input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.2); }
    .modal-inner select {
      width: 100%; border: 1px solid #d1d5db; border-radius: 6px;
      padding: 7px 10px; font-size: 14px; margin-bottom: 12px; font-family: inherit; outline: none;
      background: #fff;
    }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* Toast */
    .toast {
      position: fixed; bottom: 10px; left: 10px; right: 10px;
      background: #ef4444; color: #fff; padding: 8px 12px;
      border-radius: 6px; font-size: 13px; z-index: 20;
      display: flex; align-items: center; gap: 8px; justify-content: space-between;
    }
    .toast-report-btn {
      background: rgba(255,255,255,.2); color: #fff; font-size: 12px;
      padding: 4px 8px; flex: none; white-space: nowrap;
    }
    .toast-report-btn:hover { background: rgba(255,255,255,.32); }

    /* "Fehler melden" affordances */
    .report-bug-link {
      background: none; border: none; color: #ef4444; font-size: 12px;
      text-decoration: underline; cursor: pointer; padding: 0; margin-top: 4px;
    }

    /* Language selector — always visible, independent of the current screen */
    #lang-switcher { display: flex; justify-content: flex-end; padding: 6px 10px 0; }
    #lang-select {
      font-size: 11px; padding: 2px 4px; border: 1px solid #e5e7eb; border-radius: 4px;
      background: #fff; color: #374151; font-family: inherit;
    }
  </style>
</head>
<body>

  <!-- Language selector: rendered outside every .screen section so switching
       language is always possible, regardless of app state (checking,
       error, idle, …). See popup.js's applyStaticTranslations/setLanguage. -->
  <div id="lang-switcher">
    <select id="lang-select" aria-label="Language / Sprache / Idioma" title="Language / Sprache / Idioma">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
  </div>

  <!-- CHECKING_COMPANION -->
  <section id="screen-checking" class="screen">
    <div class="spinner"></div>
    <p data-i18n="checking.message"></p>
  </section>

  <!-- COMPANION_ERROR -->
  <section id="screen-error" class="screen hidden">
    <p class="error-icon">⚠</p>
    <p data-i18n="error.title"></p>
    <p class="error-hint" data-i18n="error.hint"></p>
    <div class="actions">
      <button id="btn-retry" class="btn-primary" data-i18n="common.retry"></button>
      <button id="btn-report-bug-error" class="btn-secondary" data-i18n="common.reportBug"></button>
    </div>
  </section>

  <!-- IDLE -->
  <section id="screen-idle" class="screen hidden">
    <div class="url-row">
      <div class="row-label" data-i18n="idle.urlLabel"></div>
      <div id="url-display" class="url-value"></div>
      <button id="btn-check-robots" class="btn-secondary btn-tiny" type="button" data-i18n="idle.robotsCheckBtn" data-i18n-title="idle.robotsCheckTitle"></button>
      <p id="robots-txt-result" class="robots-txt-result hidden"></p>
    </div>

    <div class="mode-toggle">
      <button id="btn-mode-flat" class="mode-btn active" type="button" data-i18n="idle.modeFlat"></button>
      <button id="btn-mode-container" class="mode-btn" type="button" data-i18n="idle.modeContainer"></button>
      <button id="btn-mode-api" class="mode-btn" type="button" data-i18n="idle.modeApi"></button>
    </div>

    <!-- Engine + browser actions (Issue #41/#42, Phase 5): applies across
         all three modes above, so it lives outside the mode-specific
         sections — same "global setting" treatment as output-settings
         below. Browser-actions run before extraction regardless of mode
         (see companion ScrapingPlanBuilder). -->
    <div class="engine-section">
      <div class="row-label" data-i18n="idle.engineLabel"></div>
      <div class="mode-toggle" style="margin-bottom: 8px;">
        <button id="btn-engine-static" class="mode-btn active" type="button" data-i18n="idle.engineStatic"></button>
        <button id="btn-engine-browser" class="mode-btn" type="button" data-i18n="idle.engineBrowser" data-i18n-title="idle.engineBrowserTitle"></button>
      </div>

      <div id="browser-actions-section" class="hidden">
        <div class="row-label" data-i18n="browserActions.title"></div>
        <p class="browser-actions-hint" data-i18n="browserActions.hint"></p>
        <div id="browser-actions-list"></div>
        <div class="actions">
          <button id="btn-add-action-wait" class="btn-secondary btn-tiny" type="button" data-i18n="browserActions.addWaitBtn"></button>
          <button id="btn-add-action-fill" class="btn-secondary btn-tiny" type="button" data-i18n="browserActions.addFillBtn"></button>
          <button id="btn-add-action-click" class="btn-secondary btn-tiny" type="button" data-i18n="browserActions.addClickBtn"></button>
          <button id="btn-add-action-scroll" class="btn-secondary btn-tiny" type="button" data-i18n="browserActions.addScrollBtn"></button>
        </div>
      </div>
    </div>

    <div id="flat-mode-section">
      <div class="row-label" style="margin-bottom: 6px;" data-i18n="common.fields"></div>
      <div id="fields-list"></div>
      <div class="actions">
        <button id="btn-add-field" class="btn-secondary" data-i18n="idle.addFieldBtn"></button>
      </div>
    </div>

    <div id="container-mode-section" class="hidden">
      <div class="row-label" style="margin-bottom: 6px;" data-i18n="common.containers"></div>
      <ul id="group-tree-root" class="group-tree"></ul>
      <div class="actions">
        <button id="btn-add-root-container" class="btn-secondary" data-i18n="idle.addContainerBtn"></button>
      </div>
    </div>

    <!-- API-Mode (Issue #53, Phase 6): recording (Phase 3), candidate search
         (Phase 4) and the confirmed-ApiConfig summary (Phase 5) all live
         here now, gated behind the mode toggle above like flat/container. -->
    <div id="api-mode-section" class="hidden">
      <div class="actions">
        <button id="btn-api-capture" class="btn-toggle" type="button" data-i18n="idle.apiCaptureStartBtn" data-i18n-title="idle.apiCaptureTitle"></button>
      </div>
      <p id="api-capture-summary" class="preview-summary hidden"></p>

      <!-- Recorded-endpoints viewer: lets whoever wants the detail inspect
           the raw pool directly, independent of the click-based value
           search below. -->
      <div class="actions" style="margin-top: 6px;">
        <button id="btn-api-entries-toggle" class="btn-secondary btn-tiny" type="button" disabled data-i18n-title="idle.apiEntriesTitle"></button>
      </div>
      <div id="api-entries-panel" class="api-candidates-panel hidden">
        <ul id="api-entries-list" class="api-candidates-list"></ul>
      </div>

      <div class="actions" style="margin-top: 6px;">
        <button id="btn-api-search" class="btn-secondary" type="button" disabled data-i18n="idle.apiSearchBtn" data-i18n-title="idle.apiSearchTitle"></button>
      </div>
      <div id="api-candidates-panel" class="api-candidates-panel hidden">
        <p id="api-candidates-target" class="api-candidates-target"></p>
        <ul id="api-candidates-list" class="api-candidates-list"></ul>
      </div>

      <!-- Shown once "Übernehmen" was clicked on the API_CONFIG screen;
           "Verwerfen" just clears it so a bad config isn't stuck. -->
      <div id="api-config-panel" class="api-candidates-panel hidden">
        <p id="api-config-summary" class="api-candidates-target"></p>
        <div class="actions">
          <button id="btn-api-config-discard" class="btn-secondary btn-tiny" type="button" data-i18n="common.discard"></button>
        </div>
      </div>
    </div>

    <!-- Vorschau highlights matched DOM elements — meaningless for API-Mode,
         which extracts from a JSON body instead, so it's hidden there. -->
    <div id="preview-section">
      <div class="actions" style="margin-top: 10px;">
        <button id="btn-preview" class="btn-toggle" disabled data-i18n="idle.previewShowBtn" data-i18n-title="idle.previewTitle"></button>
      </div>
      <p id="preview-summary" class="preview-summary hidden"></p>
    </div>

    <div class="output-settings">
      <div class="output-settings-row">
        <label for="input-script-filename" data-i18n="idle.scriptFilenameLabel"></label>
        <input type="text" id="input-script-filename" data-i18n-placeholder="idle.scriptFilenamePlaceholder" autocomplete="off" />
        <span class="output-settings-ext">.py</span>
      </div>
      <div class="output-settings-row">
        <label for="input-output-filename" data-i18n="idle.outputFilenameLabel"></label>
        <input type="text" id="input-output-filename" data-i18n-placeholder="idle.outputFilenamePlaceholder" autocomplete="off" />
        <span id="output-filename-ext" class="output-settings-ext">.csv</span>
      </div>
    </div>

    <div class="actions" style="margin-top: 10px;">
      <button id="btn-export-config" class="btn-secondary" disabled data-i18n="idle.exportConfigBtn" data-i18n-title="idle.exportConfigTitle"></button>
      <button id="btn-generate" class="btn-primary" disabled data-i18n="idle.generateBtn"></button>
    </div>
  </section>

  <!-- SELECTING -->
  <section id="screen-selecting" class="screen hidden">
    <p class="selecting-hint" data-i18n="selecting.hint"></p>
    <label class="dom-view-toggle">
      <input type="checkbox" id="toggle-dom-view" />
      <span data-i18n="selecting.domTreeToggle"></span>
    </label>
    <div id="dom-tree-wrapper" class="dom-tree-wrapper hidden">
      <p id="dom-tree-loading" class="dom-tree-loading" data-i18n="selecting.domTreeLoading"></p>
      <p id="dom-tree-error" class="dom-tree-error hidden">
        <span data-i18n="selecting.domTreeError"></span>
        <button id="btn-report-bug-domtree" class="report-bug-link" data-i18n="common.reportBug"></button>
      </p>
      <p id="dom-tree-truncated" class="dom-tree-truncated hidden" data-i18n="selecting.domTreeTruncated"></p>
      <ul id="dom-tree-root" class="dom-tree"></ul>
    </div>
    <button id="btn-cancel-selection" class="btn-secondary" data-i18n="selecting.cancelBtn"></button>
  </section>

  <!-- API_CONFIG (Issue #53 Phase 5) — configuring a confirmed candidate
       into an ApiConfig. Reached from the api-mode-section's "Verwenden"
       flow (see screen-idle above), which only shows once mode === 'api'. -->
  <section id="screen-api-config" class="screen hidden">
    <!-- Nested JSON tree editor (Issue #54) — subsumes the old flat field
         list entirely (Phase A5): a single top-level match renders as a
         one-node-deep tree, visually almost identical to the old list but
         wrapped in the same tree-editor chrome every deeper level reuses. -->
    <div class="row-label" data-i18n="common.fields"></div>
    <ul id="api-tree-root" class="api-tree"></ul>
    <div class="actions">
      <button id="btn-api-tree-add-root" class="btn-secondary btn-tiny" type="button" data-i18n="apiTree.addRootGroupBtn"></button>
    </div>
    <!-- Results of an "add root group"/"add sub-field" search started from
         this screen (see btn-api-tree-add-root and the tree's own per-row
         add buttons) — same markup/behavior as the primary search's
         api-candidates-panel on screen-idle, see renderApiCandidates. -->
    <div id="api-tree-search-panel" class="api-candidates-panel hidden">
      <p id="api-tree-search-target" class="api-candidates-target"></p>
      <ul id="api-tree-search-list" class="api-candidates-list"></ul>
    </div>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.urlPathLabel"></div>
    <ul id="api-config-segments" class="api-config-parts"></ul>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.urlQueryLabel"></div>
    <ul id="api-config-query-params" class="api-config-parts"></ul>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.valueSourcesLabel"></div>
    <div id="api-config-parameters"></div>

    <!-- Request-body tree (Issue #55, Phase B4) — only shown for a POST
         candidate whose captured request body could be turned into a draft
         (see loadInitialBodyTreeForCandidate); hidden entirely for a GET
         config or an unparsable/bodyless POST. -->
    <div id="api-config-body-section" class="hidden">
      <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.bodyLabel"></div>
      <ul id="body-tree-root" class="body-tree"></ul>
    </div>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.headersLabel"></div>
    <ul id="api-config-headers" class="api-config-headers"></ul>

    <div class="actions" style="margin-top: 12px;">
      <button id="btn-api-config-cancel" class="btn-secondary" type="button" data-i18n="common.cancel"></button>
      <button id="btn-api-config-confirm" class="btn-primary" type="button" disabled data-i18n="common.apply"></button>
    </div>
  </section>

  <!-- GENERATING -->
  <section id="screen-generating" class="screen hidden">
    <div class="spinner"></div>
    <p data-i18n="generating.message"></p>
  </section>

  <!-- DONE -->
  <section id="screen-done" class="screen hidden">
    <p class="success-icon">✓</p>
    <p data-i18n="done.title"></p>
    <div class="done-actions">
      <button id="btn-new-scraper" class="btn-secondary" data-i18n="done.newBtn"></button>
      <button id="btn-download" class="btn-primary" data-i18n="done.downloadBtn"></button>
    </div>
  </section>

  <!-- Modal: field-name input -->
  <div id="modal-field-name" class="modal hidden">
    <div class="modal-inner">
      <label for="input-field-name" data-i18n="modals.fieldName.label"></label>
      <input id="input-field-name" type="text" data-i18n-placeholder="modals.fieldName.placeholder" autocomplete="off" />
      <div class="modal-actions">
        <button id="btn-field-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-field-confirm" class="btn-primary" data-i18n="common.add"></button>
      </div>
    </div>
  </div>

  <!-- Modal: new container (name + type), shown before element selection starts -->
  <div id="modal-container-new" class="modal hidden">
    <div class="modal-inner">
      <label for="input-container-name" data-i18n="modals.containerNew.label"></label>
      <input id="input-container-name" type="text" data-i18n-placeholder="modals.containerNew.namePlaceholder" autocomplete="off" />
      <label data-i18n="modals.containerNew.typeLabel"></label>
      <div class="radio-row">
        <label><input type="radio" name="container-type" id="radio-container-single" checked /> <span data-i18n="modals.containerNew.single"></span></label>
        <label><input type="radio" name="container-type" id="radio-container-repeating" /> <span data-i18n="modals.containerNew.repeating"></span></label>
      </div>
      <div class="modal-actions">
        <button id="btn-container-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-container-confirm" class="btn-primary" data-i18n="modals.containerNew.next"></button>
      </div>
    </div>
  </div>

  <!-- Modal: extended field input (Container-Mode) — name, type, optional attribute -->
  <div id="modal-field-extended" class="modal hidden">
    <div class="modal-inner">
      <label for="input-field-extended-name" data-i18n="modals.fieldExtended.label"></label>
      <input id="input-field-extended-name" type="text" data-i18n-placeholder="modals.fieldExtended.placeholder" autocomplete="off" />
      <label for="select-field-mode" data-i18n="modals.fieldExtended.typeLabel"></label>
      <select id="select-field-mode">
        <option value="text" data-i18n="modals.fieldExtended.textOption"></option>
        <option value="attribute" data-i18n="modals.fieldExtended.attributeOption"></option>
        <option value="exists" data-i18n="modals.fieldExtended.existsOption"></option>
      </select>
      <div id="field-attribute-row" class="hidden">
        <label for="input-field-attribute" data-i18n="modals.fieldExtended.attributeLabel"></label>
        <input id="input-field-attribute" type="text" data-i18n-placeholder="modals.fieldExtended.attributePlaceholder" autocomplete="off" />
      </div>
      <div class="modal-actions">
        <button id="btn-field-extended-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-field-extended-confirm" class="btn-primary" data-i18n="common.add"></button>
      </div>
    </div>
  </div>

  <!-- Modal: new API-tree sub-group (Issue #54, Phase A5) — name and JSON
       path both typed directly, no click-based search: unlike a field/root
       search there's no single clicked value to derive an empty group from
       without also implying a leaf field nobody asked for (see
       confirmApiGroupModal's own doc comment). -->
  <div id="modal-api-group-new" class="modal hidden">
    <div class="modal-inner">
      <label for="input-api-group-name" data-i18n="modals.apiGroupNew.nameLabel"></label>
      <input id="input-api-group-name" type="text" data-i18n-placeholder="modals.apiGroupNew.namePlaceholder" autocomplete="off" />
      <label for="input-api-group-path" data-i18n="modals.apiGroupNew.pathLabel"></label>
      <input id="input-api-group-path" type="text" data-i18n-placeholder="modals.apiGroupNew.pathPlaceholder" autocomplete="off" />
      <div class="modal-actions">
        <button id="btn-api-group-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-api-group-confirm" class="btn-primary" data-i18n="modals.apiGroupNew.confirm"></button>
      </div>
    </div>
  </div>

  <!-- Modal: new body-only parameter name (Issue #55, Phase B4) — a body
       variable can bind to an already-declared URL parameter, or create a
       new one that exists purely to be referenced from the body; its value
       source is then configured via the exact same parameter-source card a
       URL variable part already uses (see allParameterParts/
       renderApiConfigParameters), not a second body-specific source picker. -->
  <div id="modal-api-body-parameter-new" class="modal hidden">
    <div class="modal-inner">
      <label for="input-api-body-parameter-name" data-i18n="modals.apiBodyParameterNew.nameLabel"></label>
      <input id="input-api-body-parameter-name" type="text" data-i18n-placeholder="modals.apiBodyParameterNew.namePlaceholder" autocomplete="off" />
      <div class="modal-actions">
        <button id="btn-api-body-parameter-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-api-body-parameter-confirm" class="btn-primary" data-i18n="common.add"></button>
      </div>
    </div>
  </div>

  <!-- Error toast -->
  <div id="error-toast" class="toast hidden">
    <span id="error-toast-message"></span>
    <button id="btn-report-bug-toast" class="toast-report-btn hidden" data-i18n="common.reportBug"></button>
  </div>

  <script src="../shared/logger.js"></script>
  <script src="../i18n/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
