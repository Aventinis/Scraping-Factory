<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Scraping Factory</title>
  <style>
    /* Issue #139/#140: design tokens — the small, shared source of truth
       every rule below references instead of one-off color/radius/shadow
       literals. Colors/overlays/elevation live in a separate light/dark
       block pair further down (see "Theme (Issue #140)" below); everything
       theme-agnostic (radius/motion scale) stays here in :root since it
       never needs to change when the theme does. */
    :root {
      /* Radius scale — Issue #140 modernization pass: nudged up from the
         original #139 scale (4/6/8/10) for a softer, less "boxy" feel. */
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 10px;
      --radius-xl: 14px;
      --radius-pill: 999px;

      /* One shared interaction timing, applied uniformly across buttons/
         toggles/tree rows/inputs. Issue #140: switched from a plain linear
         ease to the "standard" Material easing curve (ease-out-ish
         accelerate/decelerate) for a slightly less mechanical feel. */
      --transition-fast: 160ms cubic-bezier(0.4, 0, 0.2, 1);

      /* Text color to use on top of a saturated accent background (primary
         button, toast, picked chip, ...) — deliberately NOT the same as
         --color-surface: the former is always near-white regardless of
         theme (light or dark, the accent colors themselves stay readable
         with white text), the latter is the page/card background color,
         which inverts to near-black in dark mode. Conflating the two was
         exactly the "assumes a light background" bug Issue #140 called out
         checking for — see the theme block below for the concrete fix. */
      --color-on-accent: #fff;
    }

    /* Theme (Issue #140) — light values live directly on :root as the
       default; @media (prefers-color-scheme: dark) below redefines them
       automatically when the OS prefers dark AND the user hasn't made an
       explicit choice (:root:not([data-theme])); an explicit choice
       (html[data-theme="light"|"dark"], set by #btn-theme-toggle via
       shared/theme.js, mirroring i18n.js's own chrome.storage.local
       pattern) always wins over both, and for "light" specifically needs no
       *custom-property* rule of its own — the media query already stays out
       of its way, so :root's own defaults show through unchanged (it still
       needs a color-scheme rule below, for native form-control rendering). */
    :root {
      /* Tells the browser this page supports both schemes and to pick
         automatically per prefers-color-scheme — native widgets a custom
         --color-* token can't reach (checkbox/select-popup chrome, and any
         input/textarea, like #input-additional-urls, that has no explicit
         background/color of its own) get a correct dark rendering for free
         instead of staying stuck with the light-mode UA default. The two
         explicit-override rules further down narrow this to one scheme when
         the user picked one manually, overriding the OS preference. */
      color-scheme: light dark;
      /* Brand / primary action */
      --color-primary: #3b82f6;
      --color-primary-hover: #2563eb;
      --color-primary-disabled: #93c5fd;
      --color-primary-soft: #eff6ff;

      /* Status */
      --color-success: #16a34a;
      --color-danger: #ef4444;
      --color-danger-soft: #fee2e2;
      --color-warning: #d97706;
      --color-warning-soft: #fef3c7;
      --color-warning-strong: #b45309;

      /* Text */
      --color-text: #1a1a1a;
      --color-text-secondary: #374151;
      --color-text-muted: #6b7280;
      --color-text-faint: #9ca3af;

      /* Surfaces + borders */
      --color-surface: #fff;
      --color-surface-subtle: #f9fafb;
      --color-surface-muted: #f3f4f6;
      --color-border: #e5e7eb;
      --color-border-input: #d1d5db;

      /* Overlays */
      --overlay-scrim: rgba(0, 0, 0, .45);
      --overlay-primary-hover: rgba(59, 130, 246, .15);
      --overlay-success-selected: rgba(34, 197, 94, .2);
      --overlay-white-weak: rgba(255, 255, 255, .2);
      --overlay-white-strong: rgba(255, 255, 255, .32);
      --focus-ring: 0 0 0 3px rgba(59, 130, 246, .18);
      /* Issue #140 modernization: a soft colored glow for primary-action
         hover (see .btn-primary:hover), on top of the plain background
         swap it already had — a common "raised, glowing" accent treatment
         that a flat color change alone doesn't give. */
      --glow-primary: 0 4px 14px rgba(59, 130, 246, .35);

      /* Elevation scale — Issue #140 modernization: replaces the old flat
         --shadow-sm/--shadow-md pair with a graded system (resting card /
         hover-lifted / modal), each a layered pair of shadows (tight+dark
         for definition, soft+wide for spread) instead of one single shadow,
         for a softer, more "floating" depth. */
      --elevation-1: 0 1px 2px rgba(0, 0, 0, .06), 0 1px 1px rgba(0, 0, 0, .04);
      --elevation-2: 0 4px 12px rgba(0, 0, 0, .10), 0 2px 4px rgba(0, 0, 0, .06);
      --elevation-3: 0 16px 40px rgba(0, 0, 0, .20), 0 4px 10px rgba(0, 0, 0, .08);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --color-primary: #60a5fa;
        --color-primary-hover: #3b82f6;
        --color-primary-disabled: #3a4a63;
        --color-primary-soft: #17243a;

        --color-success: #22c55e;
        --color-danger: #f87171;
        --color-danger-soft: #3f1d1d;
        --color-warning: #fbbf24;
        --color-warning-soft: #3a2f12;
        --color-warning-strong: #fcd34d;

        --color-text: #f3f4f6;
        --color-text-secondary: #d1d5db;
        --color-text-muted: #9ca3af;
        --color-text-faint: #6b7280;

        --color-surface: #1a1d23;
        --color-surface-subtle: #23262e;
        --color-surface-muted: #2a2e37;
        --color-border: #343841;
        --color-border-input: #3f4451;

        --overlay-scrim: rgba(0, 0, 0, .6);
        --overlay-primary-hover: rgba(96, 165, 250, .18);
        --overlay-success-selected: rgba(74, 222, 128, .22);
        --focus-ring: 0 0 0 3px rgba(96, 165, 250, .28);
        --glow-primary: 0 4px 16px rgba(96, 165, 250, .45);

        --elevation-1: 0 1px 2px rgba(0, 0, 0, .4), 0 1px 1px rgba(0, 0, 0, .3);
        --elevation-2: 0 4px 14px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35);
        --elevation-3: 0 20px 48px rgba(0, 0, 0, .6), 0 6px 14px rgba(0, 0, 0, .4);
      }
    }

    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --color-primary: #60a5fa;
      --color-primary-hover: #3b82f6;
      --color-primary-disabled: #3a4a63;
      --color-primary-soft: #17243a;

      --color-success: #22c55e;
      --color-danger: #f87171;
      --color-danger-soft: #3f1d1d;
      --color-warning: #fbbf24;
      --color-warning-soft: #3a2f12;
      --color-warning-strong: #fcd34d;

      --color-text: #f3f4f6;
      --color-text-secondary: #d1d5db;
      --color-text-muted: #9ca3af;
      --color-text-faint: #6b7280;

      --color-surface: #1a1d23;
      --color-surface-subtle: #23262e;
      --color-surface-muted: #2a2e37;
      --color-border: #343841;
      --color-border-input: #3f4451;

      --overlay-scrim: rgba(0, 0, 0, .6);
      --overlay-primary-hover: rgba(96, 165, 250, .18);
      --overlay-success-selected: rgba(74, 222, 128, .22);
      --focus-ring: 0 0 0 3px rgba(96, 165, 250, .28);
      --glow-primary: 0 4px 16px rgba(96, 165, 250, .45);

      --elevation-1: 0 1px 2px rgba(0, 0, 0, .4), 0 1px 1px rgba(0, 0, 0, .3);
      --elevation-2: 0 4px 14px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .35);
      --elevation-3: 0 20px 48px rgba(0, 0, 0, .6), 0 6px 14px rgba(0, 0, 0, .4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Issue #139: one shared focus/border transition for every text input/
       textarea/select in the file, instead of each section's own input rule
       only ever snapping its border-color/box-shadow instantly. */
    input, textarea, select { transition: border-color var(--transition-fast), box-shadow var(--transition-fast); }
    /* Issue #140 modernization: slim, theme-aware scrollbars for every
       scrollable container introduced across #138/#122 — ::-webkit-scrollbar
       is Chromium-only, which is exactly the extension's own supported
       range (Chrome/Edge/Opera, see CLAUDE.md's Build section), so no
       Firefox-specific scrollbar-* fallback is needed. Listed once here as
       a combined selector rather than a new shared class, so none of these
       five elements' existing class lists (and anything that queries them)
       needs to change. */
    .screen-idle-scroll::-webkit-scrollbar, #screen-api-config::-webkit-scrollbar,
    .dom-tree-wrapper::-webkit-scrollbar, .data-preview-table-wrap::-webkit-scrollbar,
    .data-preview-text::-webkit-scrollbar {
      width: 8px; height: 8px;
    }
    .screen-idle-scroll::-webkit-scrollbar-track, #screen-api-config::-webkit-scrollbar-track,
    .dom-tree-wrapper::-webkit-scrollbar-track, .data-preview-table-wrap::-webkit-scrollbar-track,
    .data-preview-text::-webkit-scrollbar-track {
      background: transparent;
    }
    .screen-idle-scroll::-webkit-scrollbar-thumb, #screen-api-config::-webkit-scrollbar-thumb,
    .dom-tree-wrapper::-webkit-scrollbar-thumb, .data-preview-table-wrap::-webkit-scrollbar-thumb,
    .data-preview-text::-webkit-scrollbar-thumb {
      background: var(--color-border); border-radius: var(--radius-pill); border: 2px solid transparent; background-clip: padding-box;
    }
    .screen-idle-scroll::-webkit-scrollbar-thumb:hover, #screen-api-config::-webkit-scrollbar-thumb:hover,
    .dom-tree-wrapper::-webkit-scrollbar-thumb:hover, .data-preview-table-wrap::-webkit-scrollbar-thumb:hover,
    .data-preview-text::-webkit-scrollbar-thumb:hover {
      background: var(--color-text-faint); background-clip: padding-box;
    }
    /* Issue #138: the side panel is full browser-window height by default,
       unlike the classic dropdown popup this layout originally sized to
       content — html/body need an explicit height for a flex-column screen
       below to stretch to it instead of leaving dead whitespace. */
    html, body { height: 100%; }
    body {
      font-family: system-ui, sans-serif;
      font-size: 14px;
      width: 100%;
      /* The side panel is user-resizable (unlike the old dropdown popup this
         380px cap was written for) — only guard against absurdly long lines
         of text on a genuinely wide panel, don't cap the common case. */
      max-width: 640px;
      min-width: 280px;
      margin: 0 auto;
      background: var(--color-surface);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    /* Only one .screen is ever unhidden at a time (see popup.js's render());
       flex:1 lets it fill whatever height the panel actually has instead of
       being intrinsically sized to its own content. */
    .screen {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .hidden { display: none !important; }

    /* Spinner */
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #screen-checking, #screen-generating {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 120px; text-align: center; color: var(--color-text-muted);
    }

    /* Error screen */
    #screen-error { text-align: center; padding: 24px 16px; }
    /* Issue #139: inline SVG status icons instead of the old Unicode glyphs
       (⚠/✓) — hand-drawn simple shapes, no icon font/CDN. stroke="currentColor"
       on the svg itself means these two rules only need to set size + color,
       both status colors already coming from the token set above. */
    .error-icon, .success-icon { margin-bottom: 8px; }
    .error-icon svg, .success-icon svg { width: 32px; height: 32px; }
    .error-icon  { color: var(--color-danger); }
    .error-hint  { color: var(--color-text-muted); font-size: 13px; margin: 6px 0 16px; }
    .error-current-url { color: var(--color-text-faint); font-size: 11px; font-family: monospace; margin: -8px 0 16px; word-break: break-all; }
    .companion-url-override { text-align: left; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--color-border); }
    .companion-url-override label { display: block; font-size: 11px; color: var(--color-text-muted); margin-bottom: 4px; }
    .companion-url-override input[type="text"] {
      width: 100%; box-sizing: border-box; border: 1px solid var(--color-border-input); border-radius: var(--radius-md);
      padding: 5px 8px; font-size: 12px; font-family: inherit; outline: none; margin-bottom: 8px;
    }
    .companion-url-override input[type="text"]:focus { border-color: var(--color-primary); box-shadow: var(--focus-ring); }

    /* Issue #138: screen-idle is by far the longest screen (url/mode/engine/
       field/output-settings sections) — this wrapper is everything except
       the bottom actions row, so that row (Export/Generate) stays pinned at
       the bottom of the panel and only the content above it scrolls,
       instead of the whole document scrolling past the buttons. */
    .screen-idle-scroll { flex: 1; min-height: 0; overflow-y: auto; }

    /* URL row */
    .url-row     { margin-bottom: 14px; }
    .row-label   { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-faint); margin-bottom: 2px; }
    .url-value   { font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #btn-check-robots  { margin-top: 6px; }
    .robots-txt-result     { font-size: 11px; margin-top: 6px; }
    .robots-txt-allowed    { color: var(--color-success); }
    .robots-txt-disallowed { color: var(--color-danger); }
    .robots-txt-unknown    { color: var(--color-text-faint); }

    /* Fields */
    #fields-list { margin-bottom: 12px; min-height: 4px; }
    .field-row {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px; background: var(--color-surface-subtle); border-radius: var(--radius-md); margin-bottom: 4px;
    }
    .field-name     { font-weight: 500; min-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .field-selector { flex: 1; font-size: 11px; font-family: monospace; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Frame-path indicator (Issue #42, Phase 7) — flags a field/node/action
       whose selector was picked inside an iframe (see FramePath on the wire
       format); the amber tone matches content-script.js's own in-page
       overlay/badge color for the same concept. */
    .frame-badge {
      flex: none; font-size: 10px; padding: 1px 6px; border-radius: var(--radius-pill);
      background: var(--color-warning-soft); color: var(--color-warning-strong); white-space: nowrap;
    }

    /* Mode toggle */
    .mode-toggle {
      display: flex; gap: 4px; margin-bottom: 14px; background: var(--color-surface-muted);
      border-radius: var(--radius-lg); padding: 3px; position: relative;
    }
    /* Issue #140 modernization: an animated sliding "thumb" behind whichever
       .mode-btn is .active, instead of each button just recoloring itself in
       place — see popup.js's syncModeToggleThumbs for the positioning (JS,
       not CSS-only, since it depends on the active button's actual rendered
       width/offset, not a fixed value). Sits behind the buttons (z-index: 0
       vs. 1) so their own transparent background lets it show through. */
    .mode-toggle-thumb {
      position: absolute; top: 3px; bottom: 3px; left: 3px; z-index: 0;
      background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--elevation-1);
      transition: transform var(--transition-fast), width var(--transition-fast);
    }
    .mode-btn {
      position: relative; z-index: 1;
      flex: 1; background: transparent; color: var(--color-text-muted); font-size: 12px; padding: 6px 8px; border-radius: var(--radius-md);
    }
    .mode-btn:hover:not(.active) { color: var(--color-text-secondary); }
    .mode-btn.active { color: var(--color-text); font-weight: 500; }

    /* Engine toggle + browser actions (Issue #41/#42, Phase 5). Issue #140
       modernization: an outlined "card" (border, no fill — the section's
       own children, like .browser-action-card below, already use
       --color-surface-subtle, so filling the card too would collide with
       them) instead of just floating in the page flow with no grouping at
       all, to break up what otherwise reads as one long undifferentiated
       list of settings (see the same treatment on .output-settings). */
    .engine-section {
      margin-bottom: 14px; padding: 12px;
      border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    }
    .browser-actions-hint { font-size: 11px; color: var(--color-text-muted); margin-bottom: 8px; }
    .browser-action-card { padding: 8px; background: var(--color-surface-subtle); border-radius: var(--radius-md); margin-bottom: 6px; }
    .browser-action-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .browser-action-selector-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .browser-action-selector-row label { flex: none; width: 60px; font-size: 11px; color: var(--color-text-muted); }
    .browser-action-selector-row .field-selector { flex: 1; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 3px 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .browser-action-field-row { display: flex; align-items: center; gap: 6px; }
    .browser-action-field-row label { flex: none; font-size: 11px; color: var(--color-text-muted); }
    .browser-action-field-row input { flex: 1; min-width: 0; font-size: 11px; padding: 3px 6px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
    .browser-action-hint { font-size: 10px; color: var(--color-text-faint); margin: 4px 0 0; }

    /* Preview toggle */
    .btn-toggle           { background: var(--color-surface-muted); color: var(--color-text-secondary); width: 100%; }
    .btn-toggle:hover     { background: var(--color-border); }
    .btn-toggle:disabled  { color: var(--color-text-faint); cursor: default; }
    .btn-toggle.active         { background: var(--color-primary); color: var(--color-on-accent); }
    .btn-toggle.active:hover   { background: var(--color-primary-hover); }
    .preview-summary { font-size: 11px; color: var(--color-text-muted); margin-top: 6px; text-align: center; }
    .preview-summary.warn { color: var(--color-warning); }

    /* Live selector match-count hint (Issue #85) — modal-field-name/-extended */
    .match-count-hint { font-size: 11px; color: var(--color-text-muted); margin: -8px 0 12px; }
    .match-count-hint.warn { color: var(--color-warning); }

    /* Transform-chain live preview (Issue #143) — modal-field-name/-extended */
    .transform-preview { font-size: 11px; color: var(--color-text-muted); margin: 4px 0 8px; word-break: break-word; }
    .transform-preview.warn { color: var(--color-warning); }

    /* API-mode candidate search (Phase 4) */
    .api-candidates-panel { margin-top: 8px; padding: 8px; background: var(--color-surface-subtle); border-radius: var(--radius-md); }
    .api-candidates-target { font-size: 11px; color: var(--color-text-muted); margin-bottom: 6px; word-break: break-word; }
    .api-candidates-list { list-style: none; }
    .api-candidate { padding: 6px; background: var(--color-surface); border-radius: var(--radius-md); margin-bottom: 4px; font-size: 11px; }
    .api-candidate:last-child { margin-bottom: 0; }
    .api-candidate-url { font-family: monospace; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .api-candidate-path { font-family: monospace; color: var(--color-primary); margin-top: 2px; }
    .api-candidate-body { font-family: monospace; color: var(--color-text-muted); margin-top: 2px; word-break: break-word; white-space: pre-wrap; }
    .api-candidate-body-skipped { color: var(--color-text-faint); font-style: italic; }
    .api-candidate-value { color: var(--color-text-muted); margin-top: 2px; word-break: break-word; }
    .api-candidate-siblings { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .api-sibling-chip {
      font-size: 10px; padding: 2px 6px; background: var(--color-surface-muted); color: var(--color-text-secondary); border-radius: var(--radius-pill);
    }
    .api-sibling-chip:hover { background: var(--color-border); }
    .api-sibling-chip.picked { background: var(--color-primary); color: var(--color-on-accent); }
    .api-sibling-select-all {
      font-size: 10px; padding: 2px 6px; background: none; color: var(--color-primary); border: 1px dashed var(--color-primary-disabled); border-radius: var(--radius-pill);
    }
    .api-sibling-select-all:hover { background: var(--color-primary-soft); }
    .api-candidates-empty { font-size: 11px; color: var(--color-text-faint); text-align: center; padding: 4px 0; }
    .api-candidate-use { display: flex; gap: 4px; margin-top: 6px; }
    .api-candidate-field-name { flex: 1; font-size: 11px; padding: 3px 6px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
    .api-candidate-unusable { font-size: 10px; color: var(--color-text-faint); margin-top: 6px; }

    /* API-mode config screen (Phase 5). Issue #138: was hard-capped at
       max-height: 480px regardless of the actual (resizable) panel height —
       now grows via the shared .screen flex:1 rule and just scrolls
       internally within whatever height that ends up being. */
    #screen-api-config { padding: 16px; overflow-y: auto; min-height: 0; }
    .api-config-parts, .api-config-headers { list-style: none; margin-bottom: 4px; }
    .api-config-part-row, .api-config-header-row {
      display: flex; align-items: center; gap: 6px; padding: 5px 6px; background: var(--color-surface-subtle); border-radius: var(--radius-md); margin-bottom: 4px; font-size: 11px;
    }
    .api-config-part-value { flex: 1; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .api-config-part-name { width: 90px; font-size: 11px; padding: 3px 6px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
    .api-config-param-card { padding: 8px; background: var(--color-surface-subtle); border-radius: var(--radius-md); margin-bottom: 6px; }
    .api-config-param-card .row-label { margin-bottom: 4px; }
    .api-config-source-kind { display: flex; gap: 10px; font-size: 11px; margin-bottom: 6px; }
    .api-config-source-fields textarea { width: 100%; font-size: 11px; padding: 4px 6px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-family: monospace; }
    .api-config-source-fields .api-config-autofill-pool { margin-top: 4px; }
    .api-config-source-fields input[type="text"] { font-size: 11px; padding: 3px 6px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
    .api-config-range-row { display: flex; gap: 6px; margin-top: 4px; }
    .api-config-range-row input, .api-config-range-row select { flex: 1; }
    .api-config-range-format-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .api-config-range-format-row select, .api-config-range-format-row input[type="text"] { flex: 1; }
    .api-config-range-format-example { flex-basis: 100%; margin: 2px 0 0; font-size: 11px; color: var(--color-text-muted); }
    .api-config-header-row .api-config-header-name { flex: 1; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .api-config-header-mode { display: flex; gap: 6px; }
    .api-config-env-name { width: 90px; font-size: 11px; padding: 3px 6px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); }

    /* Container tree editor */
    #group-tree-root { list-style: none; margin: 0 0 10px; padding: 0; }
    .group-tree-children { list-style: none; margin: 0; padding: 0; }
    .group-tree-children.hidden { display: none; }
    .group-tree-row {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding: 4px 2px; font-size: 12px; color: var(--color-text-secondary);
    }
    .group-tree-toggle { width: 12px; flex: none; color: var(--color-text-faint); cursor: pointer; user-select: none; }
    .group-tree-label  { flex: 1; min-width: 60px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-tiny { font-size: 11px; padding: 3px 6px; }
    /* Issue #139: shared chevron icon for all three tree-toggle implementations
       (group/api/dom) — one static down-pointing SVG per row instead of each
       swapping between two different Unicode glyphs on click; collapsed state
       is just a rotation via the .collapsed class (see container-tree-ui.js/
       api-config-ui.js/popup.js's buildTreeNodeEl for the class toggling). */
    .group-tree-toggle svg, .api-tree-toggle svg, .dom-tree-toggle svg {
      width: 12px; height: 12px; display: block; transition: transform var(--transition-fast);
    }
    .group-tree-toggle.collapsed svg, .api-tree-toggle.collapsed svg, .dom-tree-toggle.collapsed svg {
      transform: rotate(-90deg);
    }
    .group-tree-row, .api-tree-row, .body-tree-row { transition: background-color var(--transition-fast); }
    .group-tree-row:hover, .api-tree-row:hover, .body-tree-row:hover {
      background: var(--color-surface-subtle); border-radius: var(--radius-sm);
    }

    /* API-Mode tree editor (Issue #54) — same visual pattern as the Container
       tree editor above, no repeating/attribute/mode label or frame badge. */
    #api-tree-root { list-style: none; margin: 0 0 10px; padding: 0; }
    .api-tree-children { list-style: none; margin: 0; padding: 0; }
    .api-tree-children.hidden { display: none; }
    .api-tree-row {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding: 4px 2px; font-size: 12px; color: var(--color-text-secondary);
    }
    .api-tree-toggle { width: 12px; flex: none; color: var(--color-text-faint); cursor: pointer; user-select: none; }
    .api-tree-name { min-width: 70px; font-weight: 500; font-size: 11px; padding: 3px 6px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
    .api-tree-path { flex: 1; min-width: 60px; font-family: monospace; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* API-Mode request-body tree editor (Issue #55) — same visual pattern
       as the API-Mode response tree above, no toggle arrow (every node
       starts fully expanded, bodies are typically small) and no per-row
       add/remove (the body's own shape is never edited, only a leaf's
       fixed/variable state — see jsonValueToBodyDraft's doc comment). */
    #body-tree-root { list-style: none; margin: 0 0 10px; padding: 0; }
    .body-tree-children { list-style: none; margin: 0; padding: 0; }
    .body-tree-row {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding: 4px 2px; font-size: 12px; color: var(--color-text-secondary);
    }
    .body-tree-label { flex: 1; min-width: 60px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .body-tree-parameter-picker, .body-tree-coerce-to { font-size: 11px; padding: 2px 4px; }

    /* Field transform-chain editor (Issue #84) — shared between
       modal-field-name (flat) and modal-field-extended (container). */
    .field-transforms-section { margin-bottom: 12px; }
    .field-transform-list { list-style: none; margin: 0 0 6px; padding: 0; }
    .transform-row {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding: 4px 2px; margin-bottom: 4px; background: var(--color-surface-subtle); border-radius: var(--radius-md);
    }
    .transform-row select, .transform-row input {
      font-size: 11px; padding: 3px 6px; margin-bottom: 0;
      border: 1px solid var(--color-border); border-radius: var(--radius-sm); width: auto;
    }
    .transform-row .transform-pattern-input, .transform-row .transform-find-input,
    .transform-row .transform-replacement-input { flex: 1; min-width: 70px; }
    .transform-row .transform-group-input { width: 56px; }
    .transform-row button { flex: none; padding: 3px 6px; font-size: 11px; }

    /* Radio row (container-type picker) — specificity beats .modal-inner label's block display */
    .radio-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; font-size: 13px; color: var(--color-text-secondary); }
    .modal-inner .radio-row label { display: flex; align-items: center; gap: 6px; font-size: inherit; margin-bottom: 0; }

    /* Selecting screen */
    #screen-selecting { text-align: center; padding: 28px 16px; }
    .selecting-hint   { color: var(--color-text-muted); margin-bottom: 16px; }

    /* DOM tree view */
    .dom-view-toggle {
      display: flex; align-items: center; gap: 6px; justify-content: center;
      font-size: 12px; color: var(--color-text-secondary); margin-bottom: 10px; cursor: pointer;
    }
    .dom-tree-wrapper {
      text-align: left; max-height: 220px; overflow: auto;
      border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 6px 8px;
      margin-bottom: 12px; background: var(--color-surface-subtle);
    }
    .dom-tree-loading, .dom-tree-truncated {
      font-size: 12px; color: var(--color-text-faint); margin: 2px 0 4px;
    }
    .dom-tree-error { font-size: 12px; color: var(--color-danger); margin: 2px 0 4px; }
    .dom-tree, .dom-tree-children { list-style: none; margin: 0; padding: 0; }
    .dom-tree-children.hidden { display: none; }
    .dom-tree-row {
      display: flex; align-items: center; gap: 4px;
      font-family: monospace; font-size: 12px; color: var(--color-text-secondary);
      padding: 1px 2px; border-radius: var(--radius-sm); cursor: default;
    }
    .dom-tree-toggle {
      width: 12px; flex: none; color: var(--color-text-faint); cursor: pointer; user-select: none;
    }
    .dom-tree-row.hover    { background: var(--overlay-primary-hover); }
    .dom-tree-row.selected { background: var(--overlay-success-selected); font-weight: 600; }

    /* Output settings (script/output filename) — shared across all three modes */
    /* Issue #140 modernization: same outlined-card treatment as
       .engine-section above — groups the Json/preview/change-detection/
       proxy toggles and the filename fields into one visually distinct
       block instead of them just running into whatever came before. */
    .output-settings {
      margin: 12px 0; padding: 12px;
      border: 1px solid var(--color-border); border-radius: var(--radius-lg);
    }
    .output-settings-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .output-settings-row label { flex: none; width: 110px; font-size: 11px; color: var(--color-text-muted); }
    .output-settings-row input[type="text"] {
      flex: 1; min-width: 0; border: 1px solid var(--color-border-input); border-radius: var(--radius-md);
      padding: 5px 8px; font-size: 12px; font-family: inherit; outline: none;
    }
    .output-settings-row input[type="text"]:focus { border-color: var(--color-primary); box-shadow: var(--focus-ring); }
    .output-settings-row textarea {
      flex: 1; min-width: 0; border: 1px solid var(--color-border-input); border-radius: var(--radius-md);
      padding: 5px 8px; font-size: 12px; font-family: inherit; outline: none; resize: vertical;
    }
    .output-settings-row textarea:focus { border-color: var(--color-primary); box-shadow: var(--focus-ring); }
    .output-settings-ext { flex: none; font-size: 12px; color: var(--color-text-faint); }
    .output-settings-toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--color-text-secondary); margin-top: 4px; cursor: pointer;
    }

    /* Done screen */
    #screen-done    { text-align: center; padding: 24px 16px; }
    .success-icon   { color: var(--color-success); }
    .done-actions   { display: flex; gap: 8px; margin-top: 16px; justify-content: center; }

    /* Issue #122: trial-run data preview panel (Done screen) */
    .data-preview-panel     { text-align: left; margin-top: 20px; }
    .data-preview-title     { font-size: 12px; font-weight: 600; color: var(--color-text-secondary); margin-bottom: 6px; }
    .data-preview-table-wrap { max-height: 220px; overflow: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); }
    .data-preview-table     { width: 100%; border-collapse: collapse; font-size: 11px; }
    .data-preview-table th, .data-preview-table td {
      padding: 4px 6px; border-bottom: 1px solid var(--color-border); text-align: left;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px;
    }
    .data-preview-table th { background: var(--color-surface-subtle); position: sticky; top: 0; }
    /* Issue #86: shared by the Xml sample and the Json tree-shape sample —
       both are a pretty-printed, read-only text fragment. */
    .data-preview-text {
      max-height: 220px; overflow: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md);
      padding: 6px 8px; margin: 0; background: var(--color-surface-subtle); font-size: 11px; white-space: pre-wrap;
    }
    .data-preview-truncated { font-size: 11px; color: var(--color-text-faint); margin: 6px 0 0; }

    /* Buttons. Issue #139: one shared interaction treatment for every button
       in the file (transition token + a uniform :active "press" feedback)
       instead of each variant only ever defining its own hover — mode-btn/
       btn-toggle below are plain <button>s too, so they inherit both from
       here for free. */
    button {
      border: none; border-radius: var(--radius-md); cursor: pointer;
      font-size: 13px; padding: 7px 12px; font-family: inherit;
      transition: background-color var(--transition-fast), color var(--transition-fast),
        box-shadow var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
    }
    button:active:not(:disabled) { transform: translateY(1px); }
    .btn-primary             { background: var(--color-primary); color: var(--color-on-accent); }
    .btn-primary:hover       { background: var(--color-primary-hover); box-shadow: var(--glow-primary); }
    .btn-primary:disabled    { background: var(--color-primary-disabled); cursor: default; box-shadow: none; }
    .btn-secondary           { background: var(--color-surface-muted); color: var(--color-text-secondary); }
    .btn-secondary:hover     { background: var(--color-border); }
    .btn-danger              { background: transparent; color: var(--color-danger); font-size: 12px; padding: 3px 6px; }
    .btn-danger:hover        { background: var(--color-danger-soft); }

    .actions { display: flex; gap: 8px; }
    .actions .btn-primary  { flex: 1; }
    .actions .btn-secondary { flex: 1; }

    /* Modal */
    .modal {
      position: fixed; inset: 0;
      background: var(--overlay-scrim);
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }
    .modal-inner {
      background: var(--color-surface); border-radius: var(--radius-xl); padding: 18px;
      width: 320px; box-shadow: var(--elevation-3);
    }
    .modal-inner label { display: block; font-size: 12px; color: var(--color-text-muted); margin-bottom: 6px; }
    .modal-inner input {
      width: 100%; border: 1px solid var(--color-border-input); border-radius: var(--radius-md);
      padding: 7px 10px; font-size: 14px; margin-bottom: 12px; font-family: inherit; outline: none;
    }
    .modal-inner input:focus { border-color: var(--color-primary); box-shadow: var(--focus-ring); }
    .modal-inner select {
      width: 100%; border: 1px solid var(--color-border-input); border-radius: var(--radius-md);
      padding: 7px 10px; font-size: 14px; margin-bottom: 12px; font-family: inherit; outline: none;
      background: var(--color-surface);
    }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* Toast */
    .toast {
      position: fixed; bottom: 10px; left: 10px; right: 10px;
      background: var(--color-danger); color: var(--color-on-accent); padding: 8px 12px;
      border-radius: var(--radius-md); font-size: 13px; z-index: 20;
      display: flex; align-items: center; gap: 8px; justify-content: space-between;
    }
    .toast-report-btn {
      background: var(--overlay-white-weak); color: var(--color-on-accent); font-size: 12px;
      padding: 4px 8px; flex: none; white-space: nowrap;
    }
    .toast-report-btn:hover { background: var(--overlay-white-strong); }
    /* Issue #85: non-error toast variants (container-group match count) */
    .toast.toast-info { background: var(--color-success); }
    .toast.toast-warn { background: var(--color-warning); }

    /* "Fehler melden" affordances */
    .report-bug-link {
      background: none; border: none; color: var(--color-danger); font-size: 12px;
      text-decoration: underline; cursor: pointer; padding: 0; margin-top: 4px;
    }

    /* Language selector — always visible, independent of the current screen */
    #lang-switcher { display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 6px 10px 0; }
    #lang-select {
      font-size: 11px; padding: 2px 4px; border: 1px solid var(--color-border); border-radius: var(--radius-sm);
      background: var(--color-surface); color: var(--color-text-secondary); font-family: inherit;
    }
    /* Theme toggle (Issue #140) — cycles system/light/dark, see shared/
       theme.js's own doc comment for why a single compact button instead of
       a dropdown (no room for a second select next to the language one at
       this panel width). */
    #theme-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; padding: 0;
      border: 1px solid var(--color-border); border-radius: var(--radius-sm);
      background: var(--color-surface); color: var(--color-text-secondary);
    }
    #theme-toggle svg { width: 14px; height: 14px; }
  </style>
</head>
<body>

  <!-- Language selector: rendered outside every .screen section so switching
       language is always possible, regardless of app state (checking,
       error, idle, …). See popup.js's applyStaticTranslations/setLanguage. -->
  <div id="lang-switcher">
    <!-- Theme toggle (Issue #140): cycles system -> light -> dark -> system
         on click (SFTheme.cycleTheme); the icon shown always reflects the
         *current* state, same as the language <select>'s own value does —
         see popup.js's renderThemeToggle. -->
    <button id="theme-toggle" type="button" data-i18n-title="theme.toggleTitle"></button>
    <select id="lang-select" aria-label="Language / Sprache / Idioma" title="Language / Sprache / Idioma">
      <option value="de">Deutsch</option>
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
  </div>

  <!-- CHECKING_COMPANION -->
  <section id="screen-checking" class="screen">
    <div class="spinner"></div>
    <p data-i18n="checking.message"></p>
  </section>

  <!-- COMPANION_ERROR -->
  <section id="screen-error" class="screen hidden">
    <p class="error-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="12 3 22 20 2 20"></polygon>
        <line x1="12" y1="9" x2="12" y2="14"></line>
        <circle cx="12" cy="17.3" r="0.6" fill="currentColor" stroke="none"></circle>
      </svg>
    </p>
    <p data-i18n="error.title"></p>
    <p class="error-hint" data-i18n="error.hint"></p>
    <p id="error-current-url" class="error-current-url"></p>
    <div class="actions">
      <button id="btn-retry" class="btn-primary" data-i18n="common.retry"></button>
      <button id="btn-report-bug-error" class="btn-secondary" data-i18n="common.reportBug"></button>
    </div>
    <div class="companion-url-override">
      <label for="input-companion-url" data-i18n="error.customUrlLabel"></label>
      <input type="text" id="input-companion-url" data-i18n-placeholder="error.customUrlPlaceholder" autocomplete="off" />
      <div class="actions">
        <button id="btn-use-companion-url" class="btn-secondary" data-i18n="error.useCustomUrl"></button>
        <button id="btn-reset-companion-url" class="btn-secondary" data-i18n="error.resetCustomUrl"></button>
      </div>
    </div>
  </section>

  <!-- IDLE -->
  <section id="screen-idle" class="screen hidden">
    <div class="screen-idle-scroll">
    <div class="url-row">
      <div class="row-label" data-i18n="idle.urlLabel"></div>
      <div id="url-display" class="url-value"></div>
      <button id="btn-check-robots" class="btn-secondary btn-tiny" type="button" data-i18n="idle.robotsCheckBtn" data-i18n-title="idle.robotsCheckTitle"></button>
      <p id="robots-txt-result" class="robots-txt-result hidden"></p>
    </div>

    <!-- Issue #83: extra start URLs the same extraction config runs against,
         in addition to the page above — mode-independent like engine/browser-
         actions, but hidden for API mode (Api builds its own request URL and
         the companion rejects the combination). Placed right under the URL
         it complements, rather than down in output-settings. -->
    <div id="additional-urls-row" class="output-settings-row" style="align-items: flex-start; margin-bottom: 14px;">
      <label for="input-additional-urls" data-i18n="idle.additionalUrlsLabel"></label>
      <textarea id="input-additional-urls" rows="3" data-i18n-placeholder="idle.additionalUrlsPlaceholder"></textarea>
    </div>

    <div class="mode-toggle">
      <div class="mode-toggle-thumb"></div>
      <button id="btn-mode-flat" class="mode-btn active" type="button" data-i18n="idle.modeFlat"></button>
      <button id="btn-mode-container" class="mode-btn" type="button" data-i18n="idle.modeContainer"></button>
      <button id="btn-mode-api" class="mode-btn" type="button" data-i18n="idle.modeApi"></button>
    </div>

    <!-- Engine + browser actions (Issue #41/#42, Phase 5): applies across
         all three modes above, so it lives outside the mode-specific
         sections — same "global setting" treatment as output-settings
         below. Browser-actions run before extraction regardless of mode
         (see companion ScrapingPlanBuilder). -->
    <div class="engine-section">
      <div class="row-label" data-i18n="idle.engineLabel"></div>
      <div class="mode-toggle" style="margin-bottom: 8px;">
        <div class="mode-toggle-thumb"></div>
        <button id="btn-engine-static" class="mode-btn active" type="button" data-i18n="idle.engineStatic"></button>
        <button id="btn-engine-browser" class="mode-btn" type="button" data-i18n="idle.engineBrowser" data-i18n-title="idle.engineBrowserTitle"></button>
      </div>

      <div id="browser-actions-section" class="hidden">
        <div class="row-label" data-i18n="browserActions.title"></div>
        <p class="browser-actions-hint" data-i18n="browserActions.hint"></p>
        <div id="browser-actions-list"></div>
        <div class="actions">
          <button id="btn-add-action-wait" class="btn-secondary btn-tiny" type="button" data-i18n="browserActions.addWaitBtn"></button>
          <button id="btn-add-action-fill" class="btn-secondary btn-tiny" type="button" data-i18n="browserActions.addFillBtn"></button>
          <button id="btn-add-action-click" class="btn-secondary btn-tiny" type="button" data-i18n="browserActions.addClickBtn"></button>
          <button id="btn-add-action-scroll" class="btn-secondary btn-tiny" type="button" data-i18n="browserActions.addScrollBtn"></button>
        </div>
      </div>
    </div>

    <div id="flat-mode-section">
      <div class="row-label" style="margin-bottom: 6px;" data-i18n="common.fields"></div>
      <div id="fields-list"></div>
      <div class="actions">
        <button id="btn-add-field" class="btn-secondary" data-i18n="idle.addFieldBtn"></button>
      </div>
    </div>

    <div id="container-mode-section" class="hidden">
      <div class="row-label" style="margin-bottom: 6px;" data-i18n="common.containers"></div>
      <ul id="group-tree-root" class="group-tree"></ul>
      <div class="actions">
        <button id="btn-add-root-container" class="btn-secondary" data-i18n="idle.addContainerBtn"></button>
      </div>
    </div>

    <!-- API-Mode (Issue #53, Phase 6): recording (Phase 3), candidate search
         (Phase 4) and the confirmed-ApiConfig summary (Phase 5) all live
         here now, gated behind the mode toggle above like flat/container. -->
    <div id="api-mode-section" class="hidden">
      <div class="actions">
        <button id="btn-api-capture" class="btn-toggle" type="button" data-i18n="idle.apiCaptureStartBtn" data-i18n-title="idle.apiCaptureTitle"></button>
      </div>
      <p id="api-capture-summary" class="preview-summary hidden"></p>

      <!-- Recorded-endpoints viewer: lets whoever wants the detail inspect
           the raw pool directly, independent of the click-based value
           search below. -->
      <div class="actions" style="margin-top: 6px;">
        <button id="btn-api-entries-toggle" class="btn-secondary btn-tiny" type="button" disabled data-i18n-title="idle.apiEntriesTitle"></button>
      </div>
      <div id="api-entries-panel" class="api-candidates-panel hidden">
        <ul id="api-entries-list" class="api-candidates-list"></ul>
      </div>

      <div class="actions" style="margin-top: 6px;">
        <button id="btn-api-search" class="btn-secondary" type="button" disabled data-i18n="idle.apiSearchBtn" data-i18n-title="idle.apiSearchTitle"></button>
      </div>
      <div id="api-candidates-panel" class="api-candidates-panel hidden">
        <p id="api-candidates-target" class="api-candidates-target"></p>
        <ul id="api-candidates-list" class="api-candidates-list"></ul>
      </div>

      <!-- Shown once "Übernehmen" was clicked on the API_CONFIG screen;
           "Verwerfen" just clears it so a bad config isn't stuck. -->
      <div id="api-config-panel" class="api-candidates-panel hidden">
        <p id="api-config-summary" class="api-candidates-target"></p>
        <div class="actions">
          <button id="btn-api-config-discard" class="btn-secondary btn-tiny" type="button" data-i18n="common.discard"></button>
        </div>
      </div>
    </div>

    <!-- Vorschau highlights matched DOM elements — meaningless for API-Mode,
         which extracts from a JSON body instead, so it's hidden there. -->
    <div id="preview-section">
      <div class="actions" style="margin-top: 10px;">
        <button id="btn-preview" class="btn-toggle" disabled data-i18n="idle.previewShowBtn" data-i18n-title="idle.previewTitle"></button>
      </div>
      <p id="preview-summary" class="preview-summary hidden"></p>
    </div>

    <div class="output-settings">
      <!-- Issue #86: opt-in Json output — mode-independent, like the data
           preview toggle below; see buildScrapingConfig's own doc comment
           for exactly which wire field this adds/replaces per mode. -->
      <label class="output-settings-toggle">
        <input type="checkbox" id="toggle-output-json" />
        <span data-i18n="idle.outputJsonToggle"></span>
      </label>
      <!-- Issue #122: opt-in trial-run data preview — unrelated to the DOM-
           highlight "Vorschau" above (preview-section); see popup.js's
           renderDataPreview doc comment for the naming rationale. -->
      <label class="output-settings-toggle">
        <input type="checkbox" id="toggle-include-data-preview" />
        <span data-i18n="idle.dataPreviewToggle"></span>
      </label>
      <!-- Issue #87: opt-in change detection + notification — every
           credential/target field below is the *name* of an environment
           variable, never a literal value (mirrors FillAction's own
           environmentVariableName input), read by the generated script at
           runtime via os.environ[...]. -->
      <label class="output-settings-toggle">
        <input type="checkbox" id="toggle-change-detection" />
        <span data-i18n="idle.changeDetectionToggle"></span>
      </label>
      <div id="change-detection-config" class="hidden">
        <div class="mode-toggle" style="margin-bottom: 8px;">
          <div class="mode-toggle-thumb"></div>
          <button id="btn-notify-email" class="mode-btn active" type="button" data-i18n="idle.notifyEmail"></button>
          <button id="btn-notify-webhook" class="mode-btn" type="button" data-i18n="idle.notifyWebhook"></button>
        </div>
        <div id="notify-email-fields">
          <div class="output-settings-row">
            <label for="input-cd-smtp-host" data-i18n="idle.smtpHostEnvVarLabel"></label>
            <input type="text" id="input-cd-smtp-host" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
          </div>
          <div class="output-settings-row">
            <label for="input-cd-smtp-port" data-i18n="idle.smtpPortEnvVarLabel"></label>
            <input type="text" id="input-cd-smtp-port" data-i18n-placeholder="idle.envVarPlaceholderOptional" autocomplete="off" />
          </div>
          <div class="output-settings-row">
            <label for="input-cd-smtp-username" data-i18n="idle.smtpUsernameEnvVarLabel"></label>
            <input type="text" id="input-cd-smtp-username" data-i18n-placeholder="idle.envVarPlaceholderOptional" autocomplete="off" />
          </div>
          <div class="output-settings-row">
            <label for="input-cd-smtp-password" data-i18n="idle.smtpPasswordEnvVarLabel"></label>
            <input type="text" id="input-cd-smtp-password" data-i18n-placeholder="idle.envVarPlaceholderOptional" autocomplete="off" />
          </div>
          <div class="output-settings-row">
            <label for="input-cd-email-from" data-i18n="idle.notifyEmailFromEnvVarLabel"></label>
            <input type="text" id="input-cd-email-from" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
          </div>
          <div class="output-settings-row">
            <label for="input-cd-email-to" data-i18n="idle.notifyEmailToEnvVarLabel"></label>
            <input type="text" id="input-cd-email-to" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
          </div>
        </div>
        <div id="notify-webhook-fields" class="hidden">
          <div class="output-settings-row">
            <label for="input-cd-webhook-url" data-i18n="idle.webhookUrlEnvVarLabel"></label>
            <input type="text" id="input-cd-webhook-url" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
          </div>
        </div>
        <p class="preview-summary" data-i18n="idle.changeDetectionHint"></p>
      </div>
      <!-- Issue #88: opt-in proxy support — like the change-detection
           fields above, this is the *name* of an environment variable
           holding a comma-separated proxy URL list, never a literal proxy
           address (mirrors FillAction's own environmentVariableName
           input), read by the generated script at runtime via
           os.environ[...]. -->
      <label class="output-settings-toggle">
        <input type="checkbox" id="toggle-proxy" />
        <span data-i18n="idle.proxyToggle"></span>
      </label>
      <div id="proxy-config" class="hidden">
        <div class="output-settings-row">
          <label for="input-proxy-env-var" data-i18n="idle.proxyEnvVarLabel"></label>
          <input type="text" id="input-proxy-env-var" data-i18n-placeholder="idle.envVarPlaceholder" autocomplete="off" />
        </div>
        <p class="preview-summary" data-i18n="idle.proxyHint"></p>
      </div>
      <!-- Issue #129: opt-in script hardening — the generated script
           re-checks its own result after scraping (e.g. before a
           cron-scheduled re-run, weeks after generation) and either warns
           (script still exits 0) or fails the run (script exits a distinct
           non-zero code) per check, independently configurable. This is
           the first of five planned checks (see CLAUDE.md) — one row per
           check, built so each of the other four can add its own row below
           without restructuring #hardening-config. -->
      <div id="hardening-config">
        <label class="output-settings-toggle">
          <input type="checkbox" id="toggle-hardening-no-result" />
          <span data-i18n="idle.hardeningNoResultToggle"></span>
        </label>
        <div id="hardening-no-result-severity" class="mode-toggle hidden" style="margin: 6px 0 8px;">
          <div class="mode-toggle-thumb"></div>
          <button id="btn-hardening-no-result-warning" class="mode-btn active" type="button" data-i18n="idle.hardeningSeverityWarning" data-i18n-title="idle.hardeningSeverityWarningTitle"></button>
          <button id="btn-hardening-no-result-error" class="mode-btn" type="button" data-i18n="idle.hardeningSeverityError" data-i18n-title="idle.hardeningSeverityErrorTitle"></button>
        </div>
      </div>
      <!-- Filenames last: a final naming step right before Export/Generate,
           below every other output-settings toggle. -->
      <div class="output-settings-row">
        <label for="input-script-filename" data-i18n="idle.scriptFilenameLabel"></label>
        <input type="text" id="input-script-filename" data-i18n-placeholder="idle.scriptFilenamePlaceholder" autocomplete="off" />
        <span class="output-settings-ext">.py</span>
      </div>
      <div class="output-settings-row">
        <label for="input-output-filename" data-i18n="idle.outputFilenameLabel"></label>
        <input type="text" id="input-output-filename" data-i18n-placeholder="idle.outputFilenamePlaceholder" autocomplete="off" />
        <span id="output-filename-ext" class="output-settings-ext">.csv</span>
      </div>
    </div>
    </div>

    <div class="actions" style="margin-top: 10px;">
      <button id="btn-export-config" class="btn-secondary" disabled data-i18n="idle.exportConfigBtn" data-i18n-title="idle.exportConfigTitle"></button>
      <button id="btn-generate" class="btn-primary" disabled data-i18n="idle.generateBtn"></button>
    </div>
  </section>

  <!-- SELECTING -->
  <section id="screen-selecting" class="screen hidden">
    <p class="selecting-hint" data-i18n="selecting.hint"></p>
    <label class="dom-view-toggle">
      <input type="checkbox" id="toggle-dom-view" />
      <span data-i18n="selecting.domTreeToggle"></span>
    </label>
    <div id="dom-tree-wrapper" class="dom-tree-wrapper hidden">
      <p id="dom-tree-loading" class="dom-tree-loading" data-i18n="selecting.domTreeLoading"></p>
      <p id="dom-tree-error" class="dom-tree-error hidden">
        <span data-i18n="selecting.domTreeError"></span>
        <button id="btn-report-bug-domtree" class="report-bug-link" data-i18n="common.reportBug"></button>
      </p>
      <p id="dom-tree-truncated" class="dom-tree-truncated hidden" data-i18n="selecting.domTreeTruncated"></p>
      <ul id="dom-tree-root" class="dom-tree"></ul>
    </div>
    <button id="btn-cancel-selection" class="btn-secondary" data-i18n="selecting.cancelBtn"></button>
  </section>

  <!-- API_CONFIG (Issue #53 Phase 5) — configuring a confirmed candidate
       into an ApiConfig. Reached from the api-mode-section's "Verwenden"
       flow (see screen-idle above), which only shows once mode === 'api'. -->
  <section id="screen-api-config" class="screen hidden">
    <!-- Nested JSON tree editor (Issue #54) — subsumes the old flat field
         list entirely (Phase A5): a single top-level match renders as a
         one-node-deep tree, visually almost identical to the old list but
         wrapped in the same tree-editor chrome every deeper level reuses. -->
    <div class="row-label" data-i18n="common.fields"></div>
    <ul id="api-tree-root" class="api-tree"></ul>
    <div class="actions">
      <button id="btn-api-tree-add-root" class="btn-secondary btn-tiny" type="button" data-i18n="apiTree.addRootGroupBtn"></button>
    </div>
    <!-- Results of an "add root group"/"add sub-field" search started from
         this screen (see btn-api-tree-add-root and the tree's own per-row
         add buttons) — same markup/behavior as the primary search's
         api-candidates-panel on screen-idle, see renderApiCandidates. -->
    <div id="api-tree-search-panel" class="api-candidates-panel hidden">
      <p id="api-tree-search-target" class="api-candidates-target"></p>
      <ul id="api-tree-search-list" class="api-candidates-list"></ul>
    </div>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.urlPathLabel"></div>
    <ul id="api-config-segments" class="api-config-parts"></ul>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.urlQueryLabel"></div>
    <ul id="api-config-query-params" class="api-config-parts"></ul>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.valueSourcesLabel"></div>
    <div id="api-config-parameters"></div>

    <!-- Request-body tree (Issue #55, Phase B4) — only shown for a POST
         candidate whose captured request body could be turned into a draft
         (see loadInitialBodyTreeForCandidate); hidden entirely for a GET
         config or an unparsable/bodyless POST. -->
    <div id="api-config-body-section" class="hidden">
      <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.bodyLabel"></div>
      <ul id="body-tree-root" class="body-tree"></ul>
    </div>

    <div class="row-label" style="margin-top: 10px;" data-i18n="apiConfig.headersLabel"></div>
    <ul id="api-config-headers" class="api-config-headers"></ul>

    <div class="actions" style="margin-top: 12px;">
      <button id="btn-api-config-cancel" class="btn-secondary" type="button" data-i18n="common.cancel"></button>
      <button id="btn-api-config-confirm" class="btn-primary" type="button" disabled data-i18n="common.apply"></button>
    </div>
  </section>

  <!-- GENERATING -->
  <section id="screen-generating" class="screen hidden">
    <div class="spinner"></div>
    <p data-i18n="generating.message"></p>
  </section>

  <!-- DONE -->
  <section id="screen-done" class="screen hidden">
    <p class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="7 12.5 10.5 16 17 8"></polyline>
      </svg>
    </p>
    <p data-i18n="done.title"></p>
    <div class="done-actions">
      <!-- Returns to IDLE with the just-used configuration (fields/groups/
           apiConfig/url/output-settings) left untouched, unlike btn-new-
           scraper's full reset — for when the sample data preview isn't
           quite right and a selector/transform needs tweaking before
           regenerating, without starting the whole scraper over. -->
      <button id="btn-back-to-config" class="btn-secondary" data-i18n="done.backBtn"></button>
      <button id="btn-new-scraper" class="btn-secondary" data-i18n="done.newBtn"></button>
      <button id="btn-download" class="btn-primary" data-i18n="done.downloadBtn"></button>
    </div>

    <!-- Issue #122: trial-run data preview — populated by renderDataPreview,
         hidden entirely when includeDataPreview was off for this /generate
         (or an older companion doesn't support it yet). -->
    <div id="data-preview-panel" class="data-preview-panel hidden">
      <p class="data-preview-title" data-i18n="done.dataPreviewTitle"></p>
      <div id="data-preview-table-wrap" class="data-preview-table-wrap hidden"></div>
      <!-- Issue #86: also holds the Json tree-shape sample, not just Xml —
           see renderDataPreview's own doc comment. -->
      <pre id="data-preview-text" class="data-preview-text hidden"></pre>
      <p id="data-preview-truncated" class="data-preview-truncated hidden"></p>
    </div>
  </section>

  <!-- Modal: field-name input -->
  <div id="modal-field-name" class="modal hidden">
    <div class="modal-inner">
      <label for="input-field-name" data-i18n="modals.fieldName.label"></label>
      <input id="input-field-name" type="text" data-i18n-placeholder="modals.fieldName.placeholder" autocomplete="off" />
      <!-- Issue #85: live match count for the just-picked selector -->
      <p id="field-name-match-count" class="match-count-hint hidden"></p>
      <!-- Issue #84: optional per-field transform chain -->
      <div class="field-transforms-section">
        <label data-i18n="transforms.sectionLabel"></label>
        <ul id="field-transform-list" class="field-transform-list"></ul>
        <button type="button" id="btn-field-transform-add" class="btn-secondary btn-tiny" data-i18n="transforms.addBtn"></button>
        <!-- Issue #143: live preview of the chain's output against the picked element's raw value -->
        <p id="field-transform-preview" class="transform-preview hidden"></p>
      </div>
      <div class="modal-actions">
        <button id="btn-field-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-field-confirm" class="btn-primary" data-i18n="common.add"></button>
      </div>
    </div>
  </div>

  <!-- Modal: new container (name + type), shown before element selection starts -->
  <div id="modal-container-new" class="modal hidden">
    <div class="modal-inner">
      <label for="input-container-name" data-i18n="modals.containerNew.label"></label>
      <input id="input-container-name" type="text" data-i18n-placeholder="modals.containerNew.namePlaceholder" autocomplete="off" />
      <label data-i18n="modals.containerNew.typeLabel"></label>
      <div class="radio-row">
        <label><input type="radio" name="container-type" id="radio-container-single" checked /> <span data-i18n="modals.containerNew.single"></span></label>
        <label><input type="radio" name="container-type" id="radio-container-repeating" /> <span data-i18n="modals.containerNew.repeating"></span></label>
      </div>
      <div class="modal-actions">
        <button id="btn-container-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-container-confirm" class="btn-primary" data-i18n="modals.containerNew.next"></button>
      </div>
    </div>
  </div>

  <!-- Modal: extended field input (Container-Mode) — name, type, optional attribute -->
  <div id="modal-field-extended" class="modal hidden">
    <div class="modal-inner">
      <label for="input-field-extended-name" data-i18n="modals.fieldExtended.label"></label>
      <input id="input-field-extended-name" type="text" data-i18n-placeholder="modals.fieldExtended.placeholder" autocomplete="off" />
      <label for="select-field-mode" data-i18n="modals.fieldExtended.typeLabel"></label>
      <select id="select-field-mode">
        <option value="text" data-i18n="modals.fieldExtended.textOption"></option>
        <option value="attribute" data-i18n="modals.fieldExtended.attributeOption"></option>
        <option value="exists" data-i18n="modals.fieldExtended.existsOption"></option>
        <!-- Issue #169: extracts only an element's direct text-node
             children, excluding text contributed by any nested element
             (e.g. a badge <span> inside a name heading) — see
             ExtractMode.OwnText's own doc comment on the companion side. -->
        <option value="ownText" data-i18n="modals.fieldExtended.ownTextOption"></option>
      </select>
      <div id="field-attribute-row" class="hidden">
        <label for="input-field-attribute" data-i18n="modals.fieldExtended.attributeLabel"></label>
        <input id="input-field-attribute" type="text" data-i18n-placeholder="modals.fieldExtended.attributePlaceholder" autocomplete="off" />
      </div>
      <!-- Issue #85: live match count for the just-picked selector -->
      <p id="field-extended-match-count" class="match-count-hint hidden"></p>
      <!-- Issue #84: optional per-field transform chain — hidden for
           "Vorhanden?" (mode === 'exists'), a boolean-ish presence check
           rather than a string pipeline. -->
      <div id="field-extended-transforms-section" class="field-transforms-section">
        <label data-i18n="transforms.sectionLabel"></label>
        <ul id="field-extended-transform-list" class="field-transform-list"></ul>
        <button type="button" id="btn-field-extended-transform-add" class="btn-secondary btn-tiny" data-i18n="transforms.addBtn"></button>
        <!-- Issue #143: live preview of the chain's output against the picked element's raw value -->
        <p id="field-extended-transform-preview" class="transform-preview hidden"></p>
      </div>
      <div class="modal-actions">
        <button id="btn-field-extended-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-field-extended-confirm" class="btn-primary" data-i18n="common.add"></button>
      </div>
    </div>
  </div>

  <!-- Modal: new API-tree sub-group (Issue #54, Phase A5) — name and JSON
       path both typed directly, no click-based search: unlike a field/root
       search there's no single clicked value to derive an empty group from
       without also implying a leaf field nobody asked for (see
       confirmApiGroupModal's own doc comment). -->
  <div id="modal-api-group-new" class="modal hidden">
    <div class="modal-inner">
      <label for="input-api-group-name" data-i18n="modals.apiGroupNew.nameLabel"></label>
      <input id="input-api-group-name" type="text" data-i18n-placeholder="modals.apiGroupNew.namePlaceholder" autocomplete="off" />
      <label for="input-api-group-path" data-i18n="modals.apiGroupNew.pathLabel"></label>
      <input id="input-api-group-path" type="text" data-i18n-placeholder="modals.apiGroupNew.pathPlaceholder" autocomplete="off" />
      <div class="modal-actions">
        <button id="btn-api-group-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-api-group-confirm" class="btn-primary" data-i18n="modals.apiGroupNew.confirm"></button>
      </div>
    </div>
  </div>

  <!-- Modal: new body-only parameter name (Issue #55, Phase B4) — a body
       variable can bind to an already-declared URL parameter, or create a
       new one that exists purely to be referenced from the body; its value
       source is then configured via the exact same parameter-source card a
       URL variable part already uses (see allParameterParts/
       renderApiConfigParameters), not a second body-specific source picker. -->
  <div id="modal-api-body-parameter-new" class="modal hidden">
    <div class="modal-inner">
      <label for="input-api-body-parameter-name" data-i18n="modals.apiBodyParameterNew.nameLabel"></label>
      <input id="input-api-body-parameter-name" type="text" data-i18n-placeholder="modals.apiBodyParameterNew.namePlaceholder" autocomplete="off" />
      <div class="modal-actions">
        <button id="btn-api-body-parameter-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-api-body-parameter-confirm" class="btn-primary" data-i18n="common.add"></button>
      </div>
    </div>
  </div>

  <!-- Modal: API-mode field transforms (Issue #84 follow-up) — reuses the
       exact same transform-chain editor as modal-field-name/-extended
       (field-transforms.js/field-transforms-ui.js), opened via the
       "Transformieren" button next to each field in the API_CONFIG tree. -->
  <div id="modal-api-field-transforms" class="modal hidden">
    <div class="modal-inner">
      <div class="field-transforms-section">
        <label data-i18n="transforms.sectionLabel"></label>
        <ul id="api-field-transform-list" class="field-transform-list"></ul>
        <button type="button" id="btn-api-field-transforms-add" class="btn-secondary btn-tiny" data-i18n="transforms.addBtn"></button>
        <!-- Issue #147: live preview against the field's captured sample value -->
        <p id="api-field-transform-preview" class="transform-preview hidden"></p>
      </div>
      <div class="modal-actions">
        <button id="btn-api-field-transforms-cancel" class="btn-secondary" data-i18n="common.cancel"></button>
        <button id="btn-api-field-transforms-confirm" class="btn-primary" data-i18n="common.apply"></button>
      </div>
    </div>
  </div>

  <!-- Error toast -->
  <div id="error-toast" class="toast hidden">
    <span id="error-toast-message"></span>
    <button id="btn-report-bug-toast" class="toast-report-btn hidden" data-i18n="common.reportBug"></button>
  </div>

  <script src="../shared/logger.js"></script>
  <script src="../shared/companion-config.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="../i18n/i18n.js"></script>
  <script src="api-config.js"></script>
  <script src="container-tree.js"></script>
  <script src="field-transforms.js"></script>
  <script src="api-config-ui.js"></script>
  <script src="container-tree-ui.js"></script>
  <script src="field-transforms-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
