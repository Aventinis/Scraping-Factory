<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elektronik-Shop — Bestseller (eingebettet und per fetch)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f7f7f9; color: #1c1c1e; padding: 40px 20px; }
    .plugin-hint {
      max-width: 780px; margin: 0 auto 32px; background: #eef4fb; border: 1px solid #9bb8d4;
      border-radius: 6px; padding: 12px 16px; font-size: 0.85rem; color: #1e4068; line-height: 1.6;
    }
    .plugin-hint strong { display: block; margin-bottom: 4px; }
    h1 { max-width: 780px; margin: 0 auto 24px; font-size: 1.6rem; }
    button { display: block; max-width: 780px; margin: 0 auto 16px; padding: 8px 14px; }
    ul.products { max-width: 780px; margin: 0 auto; list-style: none; display: flex; flex-direction: column; gap: 12px; }
    li.product { display: flex; justify-content: space-between; background: #fff; border: 1px solid #e2e2e6; border-radius: 8px; padding: 14px 18px; }
    .product-title { font-weight: 600; }
    .product-sku { color: #6b7280; }
  </style>
</head>
<body>

  <div class="plugin-hint">
    <strong>Scraping Factory — Test-Seite (Issue #507, beide Datenquellen)</strong>
    Dieselben Produkte stehen im <code>&lt;script type="application/json"&gt;</code>-Tag <em>und</em> kommen
    nach einem Klick auf „Neu laden“ per <code>fetch('/api/products')</code> — ein angeklickter Wert hat
    also einen aufgezeichneten und einen eingebetteten Treffer.
  </div>

  <h1>Bestseller</h1>
  <button id="btn-reload" type="button">Neu laden</button>
  <ul class="products" id="products"></ul>

  <script type="application/json" id="page-data">
{
  "products": [
    { "sku": "P-100", "title": "Smartphone X" },
    { "sku": "P-101", "title": "Smartphone Y" },
    { "sku": "P-200", "title": "Laptop Alpha" }
  ]
}
  </script>

  <script>
    (function () {
      var list = document.getElementById('products');
      function render(products) {
        list.textContent = '';
        products.forEach(function (product) {
          var li = document.createElement('li');
          li.className = 'product';
          [['product-title', product.title], ['product-sku', product.sku]].forEach(function (part) {
            var span = document.createElement('span');
            span.className = part[0];
            span.textContent = part[1];
            li.appendChild(span);
          });
          list.appendChild(li);
        });
      }
      render(JSON.parse(document.getElementById('page-data').textContent).products);
      document.getElementById('btn-reload').addEventListener('click', function () {
        fetch('/api/products').then(function (r) { return r.json(); }).then(function (data) { render(data.products); });
      });
    })();
  </script>

</body>
</html>
