<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Produkte mit Preis, Datum und Artikelnummer (Issue #400)</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; }
    li { margin: 0 0 12px; list-style: none; }
    span { margin-right: 14px; }
  </style>
</head>
<body>
  <!-- Fixture for the regex recipes and the date-format guess in the transform editor
       (Issue #400): the value of each field carries text around the part you want. -->
  <h1>Produkte</h1>
  <ul>
    <li class="product"><span class="name">Kaffee (Bio)</span><span class="price">Preis: 12,99 € netto</span><span class="date">28.08.2026</span><span class="sku">Art.-Nr. 4711</span></li>
    <li class="product"><span class="name">Tee (Fairtrade)</span><span class="price">Preis: 8,50 € netto</span><span class="date">05.09.2026</span><span class="sku">Art.-Nr. 4712</span></li>
    <li class="product"><span class="name">Kakao</span><span class="price">Preis: 6,20 € netto</span><span class="date">19.10.2026</span><span class="sku">Art.-Nr. 4713</span></li>
  </ul>
</body>
</html>
