<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Token-geschützte API (Issue #220)</title>
</head>
<body>
  <h1>Shop mit Token-Login</h1>
  <p>"Laden" holt zuerst ein Token per <code>POST /auth/token</code> und ruft damit <code>GET /api/items</code> auf.</p>
  <button id="btn-load" type="button">Laden</button>
  <ul id="items"></ul>
  <script>
    document.getElementById('btn-load').addEventListener('click', async () => {
      const tokenResponse = await fetch('/auth/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: 'alice', password: 's3cret' }),
      });
      const token = (await tokenResponse.json()).data.access_token;
      const itemsResponse = await fetch('/api/items?category=getraenke', { headers: { Authorization: `Bearer ${token}` } });
      const items = (await itemsResponse.json()).data.items;
      const list = document.getElementById('items');
      list.innerHTML = '';
      items.forEach((item) => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="title"></span> — <span class="price"></span>`;
        li.querySelector('.title').textContent = item.title;
        li.querySelector('.price').textContent = item.price;
        list.appendChild(li);
      });
    });
  </script>
</body>
</html>
