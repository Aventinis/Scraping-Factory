name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (CodeQL: actions/missing-workflow-permissions): the CI jobs
# only read the repository.
permissions:
  contents: read

jobs:
  companion:
    name: Companion (.NET + Python trial-run verification)
    runs-on: ubuntu-latest
    # Issue #277: a real MySQL server for the MySQL storage tests (the same
    # contract tests that run against SQLite; each test gets its own throwaway
    # database). Without SF_TEST_MYSQL those tests are reported as skipped.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psf"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The companion's test suite doesn't mock script execution — per the
      # "Consistency Rule" (see CLAUDE.md), PythonScriptVerifier actually
      # spawns python3 and runs the generated script for real, so the same
      # runtime prerequisites the companion app itself needs in production
      # (python3 + requests + beautifulsoup4, plus Playwright + Chromium for
      # the browser-engine tests) are needed here too.
      - name: Install Python runtime dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests beautifulsoup4 playwright openpyxl
          python3 -m playwright install --with-deps chromium

      # A known high or critical NuGet advisory (NU1903/NU1904) in a direct or transitive
      # package fails the build here instead of scrolling by as a warning (Issue #438).
      - name: Restore
        run: dotnet restore companion/ScrapingFactory.sln -warnaserror:NU1903,NU1904

      - name: Build
        run: dotnet build companion/ScrapingFactory.sln --no-restore --configuration Release

      - name: Test
        env:
          SF_TEST_MYSQL: Server=127.0.0.1;Port=3306;User ID=root;Password=sf
        run: dotnet test companion/ScrapingFactory.sln --no-build --configuration Release --verbosity normal

  extension:
    name: Extension (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Run tests
        working-directory: extension
        run: npm test

      - name: Typecheck JSDoc-annotated modules
        working-directory: extension
        run: npm run typecheck

      # Issue #389: the loadable extension is the esbuild output — make sure
      # it still builds and has every file the manifest points at.
      - name: Build the extension
        working-directory: extension
        run: |
          npm run build
          for f in manifest.json popup/popup.html popup/popup.js popup/popup.css popup/screens/idle.html \
                   content/content-script.js content/api-capture.js background/service-worker.js; do
            test -s "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
